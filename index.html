function buildMonthlyChart(canvasId, monthData, monthTargets, onBarClick) {
  const C = COLORS();
  const isDk = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridC = isDk ? '#2e3a4e':'#e2e6ed';
  const tickC = isDk ? '#c3c2b7':'#52514e';
  const datasets = TYPES.map(t => ({
    label:TYPE_LBL[t], data:D.fy_months.map(m=>Math.round(monthData[m][t]||0)||null),
    backgroundColor:C[t], stack:'s', borderWidth:0, borderRadius:2
  }));
  datasets.push({
    label:'Monthly Target', data:monthTargets, type:'line',
    borderColor:'var(--c-target)', borderWidth:2, borderDash:[4,3],
    pointRadius:0, fill:false, stack:undefined, order:-1
  });
  const ctx = document.getElementById(canvasId).getContext('2d');
  if (modalChart) modalChart.destroy();

  // rampInfo: {startIdx, rampEndIdx, billIdx} — indices into D.fy_months
  const ri = arguments[4] || null; // passed as 5th arg from openModal
  const isDkNow = document.documentElement.getAttribute('data-theme') === 'dark';
  // ri fields: startIdx, rampEndIdx (50% start), halfIdx (=rampEndIdx), fullIdx (100% start, -1 if outside FY)
  const rampShadePlugin = ri ? {
    id:'rampShade',
    afterDraw(chart) {
      const {ctx: c, chartArea:{left,right,top,bottom}, scales:{x}} = chart;
      const n = x.ticks.length;
      const barW = x.width / n;
      function px(idx) { return idx < n ? x.getPixelForTick(idx) : right; }

      // Zone helper: fill a band between two tick indices
      function fillBand(i0, i1, color, label) {
        if (i0 < 0 || i0 >= n) return;
        const x0 = px(i0) - barW/2;
        const x1 = i1 >= n || i1 < 0 ? right : px(Math.min(i1,n-1)) - barW/2;
        c.save(); c.fillStyle = color;
        c.fillRect(x0, top, x1-x0, bottom-top); c.restore();
        if (label && x1 - x0 > 28) {
          c.save(); c.font = '10px system-ui'; c.textAlign = 'center';
          c.fillStyle = color.replace(/[\d.]+\)$/, '0.65)');
          c.fillText(label, (x0+x1)/2, top+10); c.restore();
        }
      }

      // Phase 1 — pre-start (very faint)
      if (ri.startIdx > 0) {
        c.save(); c.fillStyle = isDkNow ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        c.fillRect(left, top, px(ri.startIdx)-barW/2-left, bottom-top); c.restore();
      }

      // Phase 2 — ramp (months 1-3): amber tint
      const rampEnd = ri.rampEndIdx >= 0 ? ri.rampEndIdx : n;
      fillBand(ri.startIdx, rampEnd, isDkNow ? 'rgba(237,161,0,0.09)' : 'rgba(237,161,0,0.10)', 'Ramp (0%)');

      // Phase 3 — 50% phase (months 4-6): blue tint
      const fullStart = ri.fullIdx >= 0 ? ri.fullIdx : n;
      if (rampEnd < n) {
        fillBand(rampEnd, fullStart, isDkNow ? 'rgba(42,120,214,0.08)' : 'rgba(42,120,214,0.08)', '50% Target');
      }

      // Boundary lines
      function vline(idx, color, dash, label) {
        if (idx < 0 || idx >= n) return;
        const p = px(idx) - barW/2;
        c.save(); c.strokeStyle = color; c.lineWidth=2; c.setLineDash(dash);
        c.beginPath(); c.moveTo(p,top); c.lineTo(p,bottom); c.stroke();
        if (label) {
          c.fillStyle = color; c.font='10px system-ui'; c.textAlign='left';
          c.fillText(label, p+3, top+10);
        }
        c.restore();
      }

      vline(ri.startIdx,   isDkNow?'rgba(237,161,0,0.7)':'rgba(180,120,0,0.7)', [4,3], 'Start');
      vline(rampEnd,       isDkNow?'rgba(42,120,214,0.7)':'rgba(20,90,190,0.7)', [4,3], '50%');
      if (ri.fullIdx >= 0) vline(ri.fullIdx, isDkNow?'rgba(27,175,122,0.8)':'rgba(0,130,90,0.8)', [], '100%');
    }
  } : null;

  modalChart = new Chart(ctx, {
    type:'bar', data:{labels:D.month_labels, datasets},
    plugins: rampShadePlugin ? [rampShadePlugin] : [],
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        footer:items=>'Total: '+fmt(items.filter(i=>i.dataset.label!=='Monthly Target').reduce((s,i)=>s+(i.raw||0),0))+' hrs'
      }}},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{
          color:(ctx2)=>{
            if (!ri) return tickC;
            const i = ctx2.index;
            if (ri.startIdx >= 0 && i >= ri.startIdx && i < (ri.rampEndIdx>=0?ri.rampEndIdx:999))
              return isDkNow ? '#c98500' : '#8a6200';  // ramp = amber
            if (ri.rampEndIdx >= 0 && i >= ri.rampEndIdx && (ri.fullIdx<0||i<ri.fullIdx))
              return isDkNow ? '#5a9de8' : '#1458b8';  // 50% phase = blue
            if (ri.fullIdx >= 0 && i >= ri.fullIdx)
              return isDkNow ? '#199e70' : '#006b4a';  // full = green
            return tickC;
          },
          font:(ctx2)=>{
            if (!ri) return {size:11};
            const i = ctx2.index;
            const bold = i===ri.startIdx || i===ri.rampEndIdx || i===ri.fullIdx;
            return {size:11, weight: bold ? '700' : 'normal'};
          }
        }},
        y:{stacked:true,grid:{color:gridC},ticks:{color:tickC,font:{size:11}}}
      },
      onClick: onBarClick ? (evt, elems) => {
        if (elems.length > 0) onBarClick(elems[0].index);
      } : undefined
    }
  });
  if (onBarClick) {
    ctx.canvas.style.cursor = 'pointer';
    ctx.canvas.title = 'Click a bar to see campaign detail';
  }
  const C2 = COLORS();
  let legend = TYPES.map(t=>`<div class="legend-item"><div class="legend-dot" style="background:${C2[t]}"></div><span>${TYPE_LBL[t]}</span></div>`).join('')+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--c-target);border-radius:50%"></div><span>Monthly Target</span></div>'+
    (onBarClick ? '<div class="legend-item" style="color:var(--text3);font-size:11px;margin-left:8px">· click bar for campaigns</div>' : '');
  if (ri) {
    const rampLbl = ri.rampEndIdx >= 0 ? `${D.month_labels[ri.startIdx]}–${D.month_labels[Math.min(ri.rampEndIdx-1, D.fy_months.length-1)]}` : D.month_labels[ri.startIdx];
    const halfLbl = ri.rampEndIdx >= 0 && ri.fullIdx > ri.rampEndIdx ? `${D.month_labels[ri.rampEndIdx]}–${D.month_labels[Math.min(ri.fullIdx-1, D.fy_months.length-1)]}` : null;
    const fullLbl = ri.fullIdx >= 0 && ri.fullIdx < D.fy_months.length ? `from ${D.month_labels[ri.fullIdx]}` : null;
    legend += `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px">
      <span style="color:${isDkNow?'#c98500':'#8a6200'}">&#9644; Ramp 0% (${rampLbl})</span>
      ${halfLbl ? `<span style="color:${isDkNow?'#5a9de8':'#1458b8'}">&#9644; 50% target (${halfLbl})</span>` : ''}
      ${fullLbl ? `<span style="color:${isDkNow?'#199e70':'#006b4a'}">&#9475; 100% ${fullLbl}</span>` : '<span style="color:var(--text3)">100% target outside FY27</span>'}
    </div>`;
  }
  return legend;
}

function kpiTile(lbl, val, sub, color) {
  return `<div class="modal-kpi"><div class="lbl">${lbl}</div><div class="val" style="color:${color||'var(--text)'}">${val}</div><div class="sub">${sub}</div></div>`;
}

// ── Instructor modal ─────────────────────────────────────────────────────────
function openModal(inst) {
  const fyMonths = D.fy_months;
  const monthData = {};
  fyMonths.forEach(m => monthData[m] = {P:0,W:0,PW:0,B:0,T:0});
  for (const r of D.records) {
    if (r.i === inst.i && monthData[r.ym]) monthData[r.ym][r.t] = (monthData[r.ym][r.t]||0) + r.h;
  }
  const fyTarget = instTarget(inst, fyMonths);
  const tot = fyMonths.reduce((s,m)=>s+total(monthData[m]),0);
  const teach = fyMonths.reduce((s,m)=>s+TYPES.filter(t=>t!=='T').reduce((ss,t)=>ss+(monthData[m][t]||0),0),0);
  const trav = fyMonths.reduce((s,m)=>s+(monthData[m].T||0),0);
  const pct = fyTarget>0 ? tot/fyTarget*100 : 0;
  const today = new Date();
  const currYm = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  const elapsedMs = fyMonths.filter(m=>m<=currYm);
  const totYtd = elapsedMs.reduce((s,m)=>s+total(monthData[m]),0);
  const expectedByNow = elapsedMs.reduce((s,m)=>s+monthlyTarget(inst,m),0);
  const paceDelta = totYtd - expectedByNow;
  const paceColor = paceDelta>=0?'var(--on)':paceDelta>=-expectedByNow*0.1?'var(--risk)':'var(--behind)';
  const paceLabel = paceDelta>=0?'ahead of pace':paceDelta>=-expectedByNow*0.1?'slightly behind':'behind pace';
  const sColor = pct>=(PACE_FRAC['FY27'])*100*0.9?'var(--on)':pct>=(PACE_FRAC['FY27'])*100*0.7?'var(--risk)':'var(--behind)';
  const sLabel = pct>=(PACE_FRAC['FY27'])*100*0.9?'On pace':pct>=(PACE_FRAC['FY27'])*100*0.7?'At risk':'Behind';

  // Collect this instructor's camp records
  const instCamps = (D.camps || []).filter(c => c.i === inst.i);
  const hasCampDetail = instCamps.length > 0;

  const body = document.getElementById('modal-body');
  const paceSign = paceDelta>=0?'+':'';
  const ytdPct = expectedByNow>0 ? totYtd/expectedByNow*100 : 0;
  body.innerHTML = `
    <div class="modal-kpis">
      <div class="modal-kpi"><div class="lbl">Pace vs Target (YTD)</div><div class="val" style="color:${paceColor}">${paceSign}${fmt(paceDelta)} hrs <span style="font-size:14px;font-weight:500">(${fmtPct(ytdPct)})</span></div><div class="sub">${fmt(expectedByNow)} hrs expected through ${D.month_labels[fyMonths.indexOf(elapsedMs[elapsedMs.length-1])]||currYm}</div></div>
      <div class="modal-kpi"><div class="lbl">Total Hours / FY27 Target</div><div class="val" style="color:${sColor}">${fmt(tot)} <span style="font-size:14px;font-weight:500;color:var(--text2)">/ ${fmt(fyTarget)}</span></div><div class="sub">${fmtPct(pct)} of target · ${fmt(Math.max(0,fyTarget-tot))} remaining</div></div>
      ${kpiTile('Teaching + Prep', fmt(teach), fmt(trav)+' hrs travel', '')}
    </div>
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Monthly Breakdown — FY27</div>
    <div style="position:relative;height:240px"><canvas id="modal-chart"></canvas></div>
    <div class="legend-row" id="modal-legend" style="margin-top:10px;margin-bottom:4px"></div>
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Cumulative Hours vs Target — FY27</div>
    <div style="position:relative;height:160px"><canvas id="modal-chart-cum"></canvas></div>
    <div style="margin-top:6px;font-size:11px;color:var(--text3);display:flex;gap:14px">
      <span><span style="display:inline-block;width:18px;height:2px;background:#2a78d6;vertical-align:middle;margin-right:4px"></span>Actual</span>
      <span><span style="display:inline-block;width:18px;height:2px;background:#898781;vertical-align:middle;margin-right:4px;border-top:2px dashed #898781"></span>Target</span>
      <span style="margin-left:auto;color:var(--text3)">● = current month</span>
    </div>
    <div id="month-detail" style="margin-top:14px"></div>`;

  // Per-month target line: null (pre-join), 0 (ramp), 50 (50% phase), 100 (full)
  const monthTargets = fyMonths.map(m => {
    const t = monthlyTarget(inst, m);
    return m < inst.start ? null : t;
  });

  // Build ramp annotation info for the chart
  const rampInfo = inst.ramp_end ? {
    startIdx: fyMonths.indexOf(inst.start),
    rampEndIdx: fyMonths.indexOf(inst.ramp_end),          // start of 50% phase
    halfIdx: fyMonths.indexOf(inst.ramp_end),             // 50% phase start
    fullIdx: inst.full_start ? fyMonths.indexOf(inst.full_start) : -1  // 100% phase start
  } : (inst.start > '2026-02' ? {
    startIdx: fyMonths.indexOf(inst.start),
    rampEndIdx: fyMonths.indexOf(inst.start),
    halfIdx: -1,
    fullIdx: fyMonths.indexOf(inst.start)
  } : null);

  function showMonthCamps(monthIdx) {
    const ym = fyMonths[monthIdx];
    const label = D.month_labels[monthIdx];
    const monthCamps = instCamps.filter(c => c.ym === ym).sort((a,b) => b.h - a.h);
    const detail = document.getElementById('month-detail');
    if (!monthCamps.length) {
      detail.innerHTML = `<div style="color:var(--text3);font-size:12px;padding:8px 0">${label}: no Salesforce campaign data</div>`;
      return;
    }
    const C = COLORS();
    const rows = monthCamps.map(c =>
      `<tr><td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.n}">${c.n}</td>
       <td style="text-align:right;padding-left:12px;white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${C[c.t]};margin-right:4px"></span>${TYPE_LBL[c.t]}</td>
       <td class="num" style="text-align:right;padding-left:12px;font-variant-numeric:tabular-nums">${fmt(c.h)} hrs</td></tr>`
    ).join('');
    const total_h = monthCamps.reduce((s,c)=>s+c.h,0);
    detail.innerHTML = `
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">${label} — Campaigns (${monthCamps.length})</div>
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr style="color:var(--text3)"><th style="text-align:left;padding-bottom:4px">Campaign</th><th style="text-align:right;padding-left:12px;padding-bottom:4px">Type</th><th style="text-align:right;padding-left:12px;padding-bottom:4px">Util Hrs</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="border-top:1px solid var(--border);font-weight:600">
          <td colspan="2" style="padding-top:4px;color:var(--text2)">Total</td>
          <td class="num" style="padding-top:4px;text-align:right;padding-left:12px">${fmt(total_h)} hrs</td>
        </tr></tfoot>
      </table>`;
  }

  document.getElementById('modal-legend').innerHTML = buildMonthlyChart('modal-chart', monthData, monthTargets, hasCampDetail ? showMonthCamps : null, rampInfo);

  // Cumulative burn-up chart
  (function() {
    const C = COLORS();
    const dk = document.documentElement.getAttribute('data-theme') === 'dark';
    const gridColor = dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
    const textColor = dk ? '#c3c2b7' : '#898781';
    let cumAct = 0, cumTgt = 0;
    const actData = [], tgtData = [], todayIdx = fyMonths.indexOf(currYm);
    fyMonths.forEach((m, idx) => {
      cumAct += total(monthData[m]);
      cumTgt += monthlyTarget(inst, m);
      actData.push(cumAct);
      tgtData.push(cumTgt);
    });
    const ctx2 = document.getElementById('modal-chart-cum').getContext('2d');
    new Chart(ctx2, {
      type: 'line',
      data: {
        labels: D.month_labels,
        datasets: [
          { label: 'Cumulative Actual', data: actData, borderColor: C.P, backgroundColor: 'transparent', borderWidth: 2, pointRadius: actData.map((_,i)=>i===todayIdx?6:2), pointBackgroundColor: actData.map((_,i)=>i===todayIdx?C.P:'transparent'), pointHoverRadius: 5, tension: 0.3 },
          { label: 'Cumulative Target', data: tgtData, borderColor: dk?'#c3c2b7':'#898781', backgroundColor: 'transparent', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { mode: 'index', intersect: false,
            callbacks: {
              title: items => {
                const lbl = items[0].label;
                return todayIdx >= 0 && items[0].dataIndex === todayIdx ? lbl + ' (current)' : lbl;
              },
              label: ctx => ctx.dataset.label + ': ' + fmt(ctx.parsed.y) + ' hrs'
            }
          }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 } } },
          y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, callback: v => fmt(v) }, beginAtZero: true }
        }
      }
    });
  })();

  // Banner if viewing a new hire while toggle is "off"
  if (hideNewHires && NEW_HIRE_IDXS.has(inst.i)) {
    const body2 = document.getElementById('modal-body');
    body2.insertAdjacentHTML('afterbegin',
      `<div style="background:rgba(237,161,0,0.12);border:1px solid rgba(237,161,0,0.35);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--text2);margin-bottom:14px">
        New hire — excluded from team targets while "New Hires: Removed" is active
      </div>`);
  }

  const nhLabel = inst.ramp_end
    ? ` · New hire ${MONTH_LABEL[inst.start]} · 50% from ${MONTH_LABEL[inst.ramp_end]}` +
      (inst.full_start && inst.full_start <= '2027-01' ? ` · 100% from ${MONTH_LABEL[inst.full_start]}` : ' · 100% in FY28')
    : (inst.start > '2026-02' ? ` · New hire ${MONTH_LABEL[inst.start]}` : '');
  showModal(inst.name, inst.region+' · '+inst.manager+nhLabel);
  const backBtn = document.getElementById('modal-back');
  if (currentManagerModal) {
    backBtn.style.display = 'flex';
  } else {
    backBtn.style.display = 'none';
  }
}

// ── Manager modal ────────────────────────────────────────────────────────────
function openManagerModal(mgr) {
  currentManagerModal = mgr;
  document.getElementById('modal-back').style.display = 'none';
  const fyMonths = D.fy_months;
  const team = activeInstructors().filter(i=>i.manager===mgr);
  const teamIdxs = new Set(team.map(i=>i.i));

  const monthData = {};
  fyMonths.forEach(m => monthData[m] = {P:0,W:0,PW:0,B:0,T:0});
  for (const r of D.records) {
    if (teamIdxs.has(r.i) && monthData[r.ym]) monthData[r.ym][r.t] = (monthData[r.ym][r.t]||0) + r.h;
  }

  // Per-instructor totals
  const byInst = {};
  for (const r of D.records) {
    if (teamIdxs.has(r.i)) {
      if (!byInst[r.i]) byInst[r.i] = {P:0,W:0,PW:0,B:0,T:0};
      byInst[r.i][r.t] = (byInst[r.i][r.t]||0) + r.h;
    }
  }

  const teamTarget = team.reduce((s,i)=>s+instTarget(i,fyMonths),0);
  const tot = fyMonths.reduce((s,m)=>s+total(monthData[m]),0);
  const pct = teamTarget>0 ? tot/teamTarget*100 : 0;
  const paceF = PACE_FRAC['FY27'];
  const sColor = pct>=paceF*100*0.9?'var(--on)':pct>=paceF*100*0.7?'var(--risk)':'var(--behind)';
  let onPace=0, atRisk=0, behind=0;
  team.forEach(inst => {
    const t = instTarget(inst,fyMonths); if(!t) return;
    const p = total(byInst[inst.i]||{})/t*100;
    if(p>=paceF*100*0.9) onPace++; else if(p>=paceF*100*0.7) atRisk++; else behind++;
  });

  // Team table rows
  const C = COLORS();
  const tableRows = team.map(inst => {
    const tm = byInst[inst.i]||{P:0,W:0,PW:0,B:0,T:0};
    const tot2 = total(tm);
    const tgt = instTarget(inst,fyMonths);
    const p = tgt>0?tot2/tgt*100:0;
    const sc = p>=paceF*100*0.9?'var(--on)':p>=paceF*100*0.7?'var(--risk)':'var(--behind)';
    return `<tr>
      <td><span class="name-link" data-inst-i="${inst.i}">${inst.name}</span></td>
      <td class="num">${tm.P>0?fmt(tm.P):''}</td>
      <td class="num">${tm.W>0?fmt(tm.W):''}</td>
      <td class="num">${tm.PW>0?fmt(tm.PW):''}</td>
      <td class="num">${tm.B>0?fmt(tm.B):''}</td>
      <td class="num">${tm.T>0?fmt(tm.T):''}</td>
      <td class="num total-bold">${fmt(tot2)}</td>
      <td class="num" style="color:${sc};font-weight:600">${tgt>0?fmtPct(p):''}</td>
      <td><div style="width:8px;height:8px;border-radius:50%;background:${sc};display:inline-block"></div></td>
    </tr>`;
  }).join('');

  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-kpis">
      ${kpiTile('Team Total Hrs', fmt(tot), tot>0?'FY27 to date':'No data', sColor)}
      ${kpiTile('Team Target', fmt(teamTarget), team.length+' instructors', '')}
      ${kpiTile('% of Target', fmtPct(pct), '', sColor)}
      ${kpiTile('On Pace', onPace+' / '+team.length, atRisk+' at risk · '+behind+' behind', '')}
    </div>
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Team Monthly Breakdown — FY27</div>
    <div style="position:relative;height:220px"><canvas id="modal-chart"></canvas></div>
    <div class="legend-row" id="modal-legend" style="margin-top:10px;margin-bottom:18px"></div>
    <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">Team Members</div>
    <table>
      <thead><tr>
        <th>Instructor</th><th class="num">Public</th><th class="num">Workshop</th>
        <th class="num">Priv WS</th><th class="num">Bootcamp</th><th class="num">Travel</th>
        <th class="num">Total</th><th class="num">%</th><th></th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>`;

  const monthTargets = fyMonths.map(m => team.reduce((s,i) => s + monthlyTarget(i,m), 0));
  document.getElementById('modal-legend').innerHTML = buildMonthlyChart('modal-chart', monthData, monthTargets);

  // Wire up name clicks to instructor modal
  body.querySelectorAll('.name-link').forEach(el=>{
    el.addEventListener('click',()=>openModal(INST_BY_IDX[+el.dataset.instI]));
  });

  showModal(mgr + ' — Team View', team.length+' instructors · '+[...new Set(team.map(i=>i.region))].join(', '));
}

// ── Events ──────────────────────────────────────────────────────────────────
document.getElementById('period-group').addEventListener('click', e => {
  const btn = e.target.closest('.period-btn');
  if (!btn) return;
  period = btn.dataset.period;
  regionFilter = null;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b===btn));
  render();
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));
    const months = getMonths(period);
    const byInst = aggByInst(months);
    renderTab(months,byInst);
  });
});
document.getElementById('modal-close').addEventListener('click',()=>closeModal());
document.getElementById('modal-back').addEventListener('click',()=>{
  if (modalChart) { modalChart.destroy(); modalChart=null; }
  const mgr = currentManagerModal;
  currentManagerModal = null;
  openManagerModal(mgr);
});
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if (e.target===e.currentTarget) {
    closeModal();
  }
});

document.getElementById('nh-btn').addEventListener('click',()=>{
  hideNewHires = !hideNewHires;
  document.getElementById('nh-btn').textContent = hideNewHires ? 'New Hires: Removed' : 'New Hires: Remove';
  document.getElementById('nh-btn').style.opacity = hideNewHires ? '0.6' : '1';
  render();
});

document.getElementById('theme-btn').addEventListener('click',()=>{
  const isDk = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDk?'light':'dark');
  document.getElementById('theme-btn').textContent = isDk ? '\u263D Dark' : '\u2600 Light';
  render();
});

render();
</script>
</body>
</html>
