// ── "By Language" state ─────────────────────────────────────────────────────
let langLangF = 'ALL';
let langCloudF = 'ALL';
let langRegionF = 'ALL';

// ── "By Language" render ────────────────────────────────────────────────────
function renderLanguage() {
  const el = document.getElementById('tab-content');

  const STATUS_ORDER = ['Certified','In Progress','Pre-Certified','Planned'];
  const STATUS_COLOR = {
    'Certified':'var(--on)',
    'Pre-Certified':'var(--risk)',
    'Planned':'#898781',
    'In Progress':'#0070d2'
  };
  const STATUS_BADGE_BG = {
    'Certified':'rgba(26,122,74,0.12)',
    'Pre-Certified':'rgba(244,185,66,0.15)',
    'Planned':'rgba(137,135,129,0.12)',
    'In Progress':'rgba(0,112,210,0.12)'
  };

  // Filter instructors — keep those who have at least one cert matching cloud filter
  // and whose languages include the selected language
  function instMatches(inst) {
    if (langLangF !== 'ALL' && !inst.languages.includes(langLangF)) return false;
    if (langCloudF !== 'ALL') {
      if (!inst.certs.some(c => c.cloud === langCloudF)) return false;
    }
    if (langRegionF !== 'ALL' && inst.region !== langRegionF) return false;
    return true;
  }

  function certMatches(cert) {
    return langCloudF === 'ALL' || cert.cloud === langCloudF;
  }

  const filteredInsts = LANG_DATA.instructors.filter(instMatches);

  // Summary counts
  const totalInsts = filteredInsts.length;
  const totalCerts = filteredInsts.reduce((s,i) => s + i.certs.filter(certMatches).length, 0);
  const certifiedCount = filteredInsts.reduce((s,i) => s + i.certs.filter(c => certMatches(c) && c.status === 'Certified').length, 0);
  const pipelineCount = filteredInsts.reduce((s,i) => s + i.certs.filter(c => certMatches(c) && c.status !== 'Certified').length, 0);

  // Language coverage counts (for heat overview)
  const langCoverage = {};
  LANG_DATA.languages.forEach(l => {
    langCoverage[l] = LANG_DATA.instructors.filter(i => i.languages.includes(l)).length;
  });

  // Cloud coverage by language
  const cloudLangMap = {};
  LANG_DATA.instructors.forEach(inst => {
    inst.languages.forEach(lang => {
      inst.certs.forEach(c => {
        const key = lang + '|' + c.cloud;
        if (!cloudLangMap[key]) cloudLangMap[key] = {certified:0, pipeline:0};
        if (c.status === 'Certified') cloudLangMap[key].certified++;
        else cloudLangMap[key].pipeline++;
      });
    });
  });

  // Pill helper
  function pill(v, current, varName) {
    const safe = v.replace(/'/g, "\\'");
    const cls = 'filter-pill' + (v === current ? ' active' : '');
    const label = v === 'ALL' ? 'All' : v;
    return '<button class="' + cls + '" onclick="' + varName + '=\'' + safe + '\';renderLanguage()">' + label + '</button>';
  }
  function pillRow(items, current, varName) {
    return items.map(v => pill(v, current, varName)).join('');
  }

  // Build language overview grid
  let overviewHtml = '';
  const displayLangs = langLangF === 'ALL' ? LANG_DATA.languages : [langLangF];
  displayLangs.forEach(lang => {
    const instsForLang = LANG_DATA.instructors.filter(i => i.languages.includes(lang));
    const certCount = instsForLang.length;
    const clouds = [...new Set(instsForLang.flatMap(i => i.certs.map(c => c.cloud)))].sort();
    overviewHtml += '<div class="card" style="padding:14px 16px;cursor:pointer" onclick="langLangF=\'' + lang + '\';renderLanguage()">';
    overviewHtml += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">';
    overviewHtml += '<span style="font-size:15px;font-weight:700;color:var(--text)">' + lang + '</span>';
    overviewHtml += '<span style="font-size:13px;font-weight:600;color:var(--c-P)">' + certCount + ' instructor' + (certCount !== 1 ? 's' : '') + '</span>';
    overviewHtml += '</div>';
    overviewHtml += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    clouds.forEach(cl => {
      overviewHtml += '<span style="font-size:11px;background:var(--border);padding:2px 7px;border-radius:10px;color:var(--text2)">' + cl + '</span>';
    });
    overviewHtml += '</div></div>';
  });

  // Build instructor table rows
  let tableRowsHtml = '';
  filteredInsts.forEach(inst => {
    const instCerts = inst.certs.filter(certMatches).sort((a,b) => {
      return STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.course.localeCompare(b.course);
    });
    const certifiedCerts = instCerts.filter(c => c.status === 'Certified');
    const pipelineCerts = instCerts.filter(c => c.status !== 'Certified');
    const instId = 'lang-inst-' + inst.name.replace(/[^a-z0-9]/gi,'_');

    // Group certs by cloud for the detail expand
    const byCloud = {};
    instCerts.forEach(c => {
      if (!byCloud[c.cloud]) byCloud[c.cloud] = [];
      byCloud[c.cloud].push(c);
    });

    // Summary row
    tableRowsHtml += '<tr class="lang-inst-row" onclick="toggleLangDetail(\'' + instId + '\')" style="cursor:pointer;border-bottom:1px solid var(--border)">';
    tableRowsHtml += '<td style="padding:10px 12px;font-weight:600;color:var(--text)">' + inst.name + '</td>';
    tableRowsHtml += '<td style="padding:10px 12px;font-size:12px;color:var(--text2)">' + inst.region + '</td>';
    tableRowsHtml += '<td style="padding:10px 12px">';
    inst.languages.filter(l => langLangF === 'ALL' || l === langLangF).forEach(l => {
      tableRowsHtml += '<span style="font-size:11px;font-weight:700;background:var(--border);padding:2px 7px;border-radius:10px;color:var(--text2);margin-right:4px">' + l + '</span>';
    });
    tableRowsHtml += '</td>';
    tableRowsHtml += '<td style="padding:10px 12px;text-align:center;font-weight:700;color:var(--on)">' + certifiedCerts.length + '</td>';
    tableRowsHtml += '<td style="padding:10px 12px;text-align:center;font-weight:700;color:var(--risk)">' + pipelineCerts.length + '</td>';
    tableRowsHtml += '<td style="padding:10px 12px;font-size:12px;color:var(--text2)">';
    const cloudSet = [...new Set(instCerts.map(c => c.cloud))].sort();
    cloudSet.forEach(cl => {
      tableRowsHtml += '<span style="display:inline-block;margin-right:4px;font-size:11px">' + cl + '</span>';
    });
    tableRowsHtml += '</td>';
    tableRowsHtml += '</tr>';

    // Expand detail row
    tableRowsHtml += '<tr id="' + instId + '" style="display:none"><td colspan="6" style="padding:0 12px 12px 12px;background:var(--surface2,var(--surface))">';
    Object.entries(byCloud).sort().forEach(([cloud, certs]) => {
      tableRowsHtml += '<div style="margin-top:10px">';
      tableRowsHtml += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:5px">' + cloud + '</div>';
      tableRowsHtml += '<div style="display:flex;flex-wrap:wrap;gap:5px">';
      certs.forEach(c => {
        const bg = STATUS_BADGE_BG[c.status] || 'rgba(137,135,129,0.1)';
        const col = STATUS_COLOR[c.status] || '#898781';
        tableRowsHtml += '<span style="font-size:12px;padding:3px 9px;border-radius:12px;background:' + bg + ';color:' + col + ';font-weight:600" title="' + c.status + (c.exp ? ' · ' + c.exp : '') + '">' + c.course + '</span>';
      });
      tableRowsHtml += '</div></div>';
    });
    tableRowsHtml += '</td></tr>';
  });

  // Build full HTML (no nested template literals)
  let html = '';

  // Derive unique regions from LANG_DATA
  const allRegions = [...new Set(LANG_DATA.instructors.map(i => i.region))].sort();

  // Filters
  html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px">';
  html += '<span style="font-size:12px;color:var(--text-muted);font-weight:600">Language:</span>';
  html += '<div class="filter-pills">' + pillRow(['ALL'].concat(LANG_DATA.languages), langLangF, 'langLangF') + '</div>';
  html += '<span style="font-size:12px;color:var(--text-muted);font-weight:600;margin-left:12px">Cloud:</span>';
  html += '<div class="filter-pills">' + pillRow(['ALL'].concat(LANG_DATA.clouds), langCloudF, 'langCloudF') + '</div>';
  html += '<span style="font-size:12px;color:var(--text-muted);font-weight:600;margin-left:12px">Region:</span>';
  html += '<div class="filter-pills">' + pillRow(['ALL'].concat(allRegions), langRegionF, 'langRegionF') + '</div>';
  if (langLangF !== 'ALL' || langCloudF !== 'ALL' || langRegionF !== 'ALL') {
    html += '<button class="filter-pill" onclick="langLangF=\'ALL\';langCloudF=\'ALL\';langRegionF=\'ALL\';renderLanguage()" style="margin-left:4px;opacity:0.7">✕ Clear</button>';
  }
  html += '</div>';

  // KPI tiles
  html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">';
  html += '<div class="card" style="text-align:center;padding:16px 12px"><div style="font-size:1.8rem;font-weight:700;color:var(--c-P)">' + LANG_DATA.languages.length + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Languages</div></div>';
  html += '<div class="card" style="text-align:center;padding:16px 12px"><div style="font-size:1.8rem;font-weight:700;color:var(--c-P)">' + totalInsts + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Instructors</div></div>';
  html += '<div class="card" style="text-align:center;padding:16px 12px"><div style="font-size:1.8rem;font-weight:700;color:var(--on)">' + certifiedCount + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Certified Courses</div></div>';
  html += '<div class="card" style="text-align:center;padding:16px 12px"><div style="font-size:1.8rem;font-weight:700;color:var(--risk)">' + pipelineCount + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">In Pipeline</div></div>';
  html += '</div>';

  // ── Bar charts ──────────────────────────────────────────────────────────────
  {
    // Chart 1: Instructors by language (filtered by region/cloud)
    const langBarData = LANG_DATA.languages.map(lang => {
      const count = filteredInsts.filter(i => i.languages.includes(lang)).length;
      return { label: lang, count };
    }).filter(d => d.count > 0).sort((a,b) => b.count - a.count);

    // Chart 2: Instructors by region (filtered by lang/cloud)
    const regionBarData = allRegions.map(r => {
      const count = filteredInsts.filter(i => i.region === r).length;
      return { label: r, count };
    }).filter(d => d.count > 0).sort((a,b) => b.count - a.count);

    // Chart 3: Certs by cloud split certified vs pipeline (filtered)
    const cloudBarData = LANG_DATA.clouds.map(cl => {
      const certified = filteredInsts.reduce((s,i) => s + i.certs.filter(c => certMatches(c) && c.cloud === cl && c.status === 'Certified').length, 0);
      const pipeline = filteredInsts.reduce((s,i) => s + i.certs.filter(c => certMatches(c) && c.cloud === cl && c.status !== 'Certified').length, 0);
      return { label: cl, certified, pipeline, total: certified + pipeline };
    }).filter(d => d.total > 0).sort((a,b) => b.total - a.total);

    function barChart(title, rows, maxVal, renderBar) {
      let ch = '<div class="card" style="padding:16px 18px">';
      ch += '<div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">' + title + '</div>';
      rows.forEach(row => {
        ch += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">';
        ch += '<div style="width:100px;min-width:100px;font-size:12px;color:var(--text2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + row.label + '</div>';
        ch += '<div style="flex:1;position:relative;height:18px;background:var(--border);border-radius:3px;overflow:hidden">';
        ch += renderBar(row, maxVal);
        ch += '</div>';
        ch += '<div style="font-size:12px;color:var(--text2);min-width:28px;text-align:right">' + (row.total !== undefined ? row.total : row.count) + '</div>';
        ch += '</div>';
      });
      ch += '</div>';
      return ch;
    }

    const maxLang = Math.max(...langBarData.map(d => d.count), 1);
    const maxReg = Math.max(...regionBarData.map(d => d.count), 1);
    const maxCloud = Math.max(...cloudBarData.map(d => d.total), 1);

    let chartsHtml = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px">';

    chartsHtml += barChart('Instructors by Language', langBarData, maxLang, (row, mv) => {
      const pct = Math.round(row.count / mv * 100);
      return '<div style="position:absolute;top:0;left:0;height:100%;width:' + pct + '%;background:var(--c-P);border-radius:3px;transition:width .3s"></div>';
    });

    chartsHtml += barChart('Instructors by Region', regionBarData, maxReg, (row, mv) => {
      const pct = Math.round(row.count / mv * 100);
      return '<div style="position:absolute;top:0;left:0;height:100%;width:' + pct + '%;background:#0070d2;border-radius:3px;transition:width .3s"></div>';
    });

    chartsHtml += barChart('Certifications by Cloud', cloudBarData, maxCloud, (row, mv) => {
      const certPct = Math.round(row.certified / mv * 100);
      const pipePct = Math.round(row.pipeline / mv * 100);
      return '<div style="position:absolute;top:0;left:0;height:100%;width:' + certPct + '%;background:var(--on);border-radius:3px 0 0 3px;transition:width .3s"></div>' +
             '<div style="position:absolute;top:0;left:' + certPct + '%;height:100%;width:' + pipePct + '%;background:var(--risk);border-radius:0 3px 3px 0;transition:width .3s"></div>';
    });

    chartsHtml += '</div>';

    // Legend for cloud chart
    chartsHtml += '<div style="display:flex;gap:16px;font-size:11px;color:var(--text2);margin-bottom:20px;justify-content:flex-end">';
    chartsHtml += '<span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--on)"></span>Certified</span>';
    chartsHtml += '<span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--risk)"></span>Pipeline</span>';
    chartsHtml += '</div>';

    html += chartsHtml;
  }

  // ── Course tiles (when a cloud is selected) OR Language overview ─────────────
  if (langCloudF !== 'ALL') {
    // Build course/workshop tiles for the selected cloud
    const courseTileMap = {}; // course → {languages: [], instructorCount, certified: [], pipeline: []}
    filteredInsts.forEach(inst => {
      inst.certs.filter(c => c.cloud === langCloudF).forEach(c => {
        if (!courseTileMap[c.course]) courseTileMap[c.course] = {languages: new Set(), certified: new Set(), pipeline: new Set()};
        inst.languages.forEach(l => courseTileMap[c.course].languages.add(l));
        if (c.status === 'Certified') courseTileMap[c.course].certified.add(inst.name);
        else courseTileMap[c.course].pipeline.add(inst.name);
      });
    });
    const courseTileEntries = Object.entries(courseTileMap)
      .sort((a, b) => b[1].certified.size - a[1].certified.size || a[0].localeCompare(b[0]));

    if (courseTileEntries.length) {
      html += '<div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">' + langCloudF + ' — Courses &amp; Workshops';
      html += ' <span style="font-size:11px;font-weight:400;color:var(--text3)">· language coverage per course</span></div>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px">';
      courseTileEntries.forEach(function(entry) {
        var course = entry[0]; var data = entry[1];
        var certCount = data.certified.size; var pipeCount = data.pipeline.size;
        var langs = Array.from(data.languages).sort();
        html += '<div class="card" style="padding:14px 16px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">';
        html += '<span style="font-size:14px;font-weight:700;color:var(--text)">' + course + '</span>';
        html += '<span style="font-size:11px;color:var(--text3)">' + (certCount + pipeCount) + ' inst.</span>';
        html += '</div>';
        // Language badges
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">';
        langs.forEach(function(l) {
          html += '<span style="font-size:11px;font-weight:600;background:var(--border);padding:2px 7px;border-radius:10px;color:var(--text2)">' + l + '</span>';
        });
        html += '</div>';
        // Status mini-bar
        html += '<div style="display:flex;gap:8px;font-size:11px">';
        if (certCount) html += '<span style="color:var(--on);font-weight:600">' + certCount + ' certified</span>';
        if (pipeCount) html += '<span style="color:var(--risk);font-weight:600">' + pipeCount + ' pipeline</span>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
  } else if (langLangF === 'ALL') {
    html += '<div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Language Coverage Overview <span style="font-size:11px;font-weight:400;color:var(--text3)">· click a card to filter</span></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px">' + overviewHtml + '</div>';
  }

  // ── Instructor table ──────────────────────────────────────────────────────
  const cloudSelected = langCloudF !== 'ALL';
  // Rebuild table rows with cloud-specific course columns when a cloud is selected
  let finalTableRowsHtml = '';
  const colSpan = cloudSelected ? 5 : 6;
  filteredInsts.forEach(function(inst) {
    const instCerts = inst.certs.filter(certMatches).sort(function(a,b) {
      return STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.course.localeCompare(b.course);
    });
    const certifiedCerts = instCerts.filter(function(c) { return c.status === 'Certified'; });
    const pipelineCerts  = instCerts.filter(function(c) { return c.status !== 'Certified'; });
    const instId = 'lang-inst-' + inst.name.replace(/[^a-z0-9]/gi,'_');
    const byCloud = {};
    instCerts.forEach(function(c) {
      if (!byCloud[c.cloud]) byCloud[c.cloud] = [];
      byCloud[c.cloud].push(c);
    });

    finalTableRowsHtml += '<tr class="lang-inst-row" onclick="toggleLangDetail(\'' + instId + '\')" style="cursor:pointer;border-bottom:1px solid var(--border)">';
    finalTableRowsHtml += '<td style="padding:10px 12px;font-weight:600;color:var(--text)">' + inst.name + '</td>';
    finalTableRowsHtml += '<td style="padding:10px 12px;font-size:12px;color:var(--text2)">' + inst.region + '</td>';
    finalTableRowsHtml += '<td style="padding:10px 12px">';
    inst.languages.filter(function(l) { return langLangF === 'ALL' || l === langLangF; }).forEach(function(l) {
      finalTableRowsHtml += '<span style="font-size:11px;font-weight:700;background:var(--border);padding:2px 7px;border-radius:10px;color:var(--text2);margin-right:4px">' + l + '</span>';
    });
    finalTableRowsHtml += '</td>';

    if (cloudSelected) {
      // Certified courses column
      finalTableRowsHtml += '<td style="padding:10px 12px;vertical-align:top">';
      certifiedCerts.forEach(function(c) {
        finalTableRowsHtml += '<span style="display:inline-block;font-size:11px;font-weight:600;background:rgba(26,122,74,0.1);color:#1a7a4a;border-radius:10px;padding:2px 7px;margin:2px 3px 2px 0">' + c.course + '</span>';
      });
      if (!certifiedCerts.length) finalTableRowsHtml += '<span style="font-size:11px;color:var(--text3)">—</span>';
      finalTableRowsHtml += '</td>';
      // Pipeline / other courses column
      finalTableRowsHtml += '<td style="padding:10px 12px;vertical-align:top">';
      pipelineCerts.forEach(function(c) {
        const bg = STATUS_BADGE_BG[c.status] || 'rgba(137,135,129,0.1)';
        const col = STATUS_COLOR[c.status] || '#898781';
        finalTableRowsHtml += '<span style="display:inline-block;font-size:11px;font-weight:600;border-radius:10px;padding:2px 7px;margin:2px 3px 2px 0;background:' + bg + ';color:' + col + '" title="' + c.status + '">' + c.course + '</span>';
      });
      if (!pipelineCerts.length) finalTableRowsHtml += '<span style="font-size:11px;color:var(--text3)">—</span>';
      finalTableRowsHtml += '</td>';
    } else {
      finalTableRowsHtml += '<td style="padding:10px 12px;text-align:center;font-weight:700;color:var(--on)">' + certifiedCerts.length + '</td>';
      finalTableRowsHtml += '<td style="padding:10px 12px;text-align:center;font-weight:700;color:var(--risk)">' + pipelineCerts.length + '</td>';
      finalTableRowsHtml += '<td style="padding:10px 12px;font-size:12px;color:var(--text2)">';
      const cloudSet = [...new Set(instCerts.map(function(c) { return c.cloud; }))].sort();
      cloudSet.forEach(function(cl) {
        finalTableRowsHtml += '<span style="display:inline-block;margin-right:4px;font-size:11px">' + cl + '</span>';
      });
      finalTableRowsHtml += '</td>';
    }
    finalTableRowsHtml += '</tr>';

    // Expand detail row
    finalTableRowsHtml += '<tr id="' + instId + '" style="display:none"><td colspan="' + colSpan + '" style="padding:0 12px 12px 12px;background:var(--surface2,var(--surface))">';
    Object.entries(byCloud).sort().forEach(function(pair) {
      var cloud = pair[0]; var certs = pair[1];
      finalTableRowsHtml += '<div style="margin-top:10px">';
      finalTableRowsHtml += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:5px">' + cloud + '</div>';
      finalTableRowsHtml += '<div style="display:flex;flex-wrap:wrap;gap:5px">';
      certs.forEach(function(c) {
        const bg = STATUS_BADGE_BG[c.status] || 'rgba(137,135,129,0.1)';
        const col = STATUS_COLOR[c.status] || '#898781';
        finalTableRowsHtml += '<span style="font-size:12px;padding:3px 9px;border-radius:12px;background:' + bg + ';color:' + col + ';font-weight:600" title="' + c.status + (c.exp ? ' · ' + c.exp : '') + '">' + c.course + '</span>';
      });
      finalTableRowsHtml += '</div></div>';
    });
    finalTableRowsHtml += '</td></tr>';
  });

  html += '<div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Instructors';
  if (langLangF !== 'ALL') html += ' — ' + langLangF;
  if (langCloudF !== 'ALL') html += ' · ' + langCloudF;
  if (langRegionF !== 'ALL') html += ' · ' + langRegionF;
  html += ' <span style="font-size:11px;font-weight:400;color:var(--text3)">· click a row to expand certifications</span></div>';

  html += '<div class="card" style="padding:0;overflow:hidden">';
  html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<thead><tr style="border-bottom:1px solid var(--border);background:var(--surface2,var(--surface))">';
  html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--text2);font-size:12px">Instructor</th>';
  html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--text2);font-size:12px">Region</th>';
  html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--text2);font-size:12px">Language(s)</th>';
  if (cloudSelected) {
    html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--on);font-size:12px">Certified</th>';
    html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--risk);font-size:12px">Other (Pipeline)</th>';
  } else {
    html += '<th style="text-align:center;padding:8px 12px;font-weight:600;color:var(--on);font-size:12px">Certified</th>';
    html += '<th style="text-align:center;padding:8px 12px;font-weight:600;color:var(--risk);font-size:12px">Pipeline</th>';
    html += '<th style="text-align:left;padding:8px 12px;font-weight:600;color:var(--text2);font-size:12px">Clouds</th>';
  }
  html += '</tr></thead>';
  html += '<tbody>' + finalTableRowsHtml + '</tbody>';
  html += '</table></div>';

  el.innerHTML = html;
}

function toggleLangDetail(id) {
  const row = document.getElementById(id);
  if (!row) return;
  const isOpen = row.style.display !== 'none';
  // Close all
  document.querySelectorAll('[id^="lang-inst-"]').forEach(r => r.style.display = 'none');
  if (!isOpen) row.style.display = '';
}

function render() {
  const months = getMonths(period);
  const byInst = aggByInst(months);
  renderKPIs(months, byInst);
  renderTrend(months);
  renderTypeChart(byInst);
  renderTab(months, byInst);
}

let modalChart = null;
let currentManagerModal = null;

function buildMonthlyChart(canvasId, monthData, monthTargets, onBarClick) {
  const C = COLORS();
  const isDk = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridC = isDk ? '#2e3a4e':'#e2e6ed';
  const tickC = isDk ? '#c3c2b7':'#52514e';
  const visTypes2 = rawTeach ? TYPES.filter(t=>t!=='T') : TYPES;
  const datasets = visTypes2.map(t => ({
    label:TYPE_LBL[t],
    data:D.fy_months.map(m => { const v=monthData[m][t]||0; return (Math.round(rawTeach?toRaw(v):v)||null); }),
    backgroundColor:C[t], stack:'s', borderWidth:0, borderRadius:2
  }));
  datasets.push({
    label:'Monthly Target', data:monthTargets, type:'line',
    borderColor:'var(--c-target)', borderWidth:2, borderDash:[4,3],
    pointRadius:0, fill:false, stack:undefined, order:-1
  });
  const ctx = document.getElementById(canvasId).getContext('2d');
  if (modalChart) modalChart.destroy();

  // rampInfo: {startIdx, rampEndIdx, billIdx} — indices into D.fy_months
  const ri = arguments[4] || null; // passed as 5th arg from openModal
  const isDkNow = document.documentElement.getAttribute('data-theme') === 'dark';
  // ri fields: startIdx, rampEndIdx (50% start), halfIdx (=rampEndIdx), fullIdx (100% start, -1 if outside FY)
  const rampShadePlugin = ri ? {
    id:'rampShade',
    afterDraw(chart) {
      const {ctx: c, chartArea:{left,right,top,bottom}, scales:{x}} = chart;
      const n = x.ticks.length;
      const barW = x.width / n;
      function px(idx) { return idx < n ? x.getPixelForTick(idx) : right; }

      // Zone helper: fill a band between two tick indices
      function fillBand(i0, i1, color, label) {
        if (i0 < 0 || i0 >= n) return;
        const x0 = px(i0) - barW/2;
        const x1 = i1 >= n || i1 < 0 ? right : px(Math.min(i1,n-1)) - barW/2;
        c.save(); c.fillStyle = color;
        c.fillRect(x0, top, x1-x0, bottom-top); c.restore();
        if (label && x1 - x0 > 28) {
          c.save(); c.font = '10px system-ui'; c.textAlign = 'center';
          c.fillStyle = color.replace(/[\d.]+\)$/, '0.65)');
          c.fillText(label, (x0+x1)/2, top+10); c.restore();
        }
      }

      // Phase 1 — pre-start (very faint)
      if (ri.startIdx > 0) {
        c.save(); c.fillStyle = isDkNow ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        c.fillRect(left, top, px(ri.startIdx)-barW/2-left, bottom-top); c.restore();
      }

      // Phase 2 — ramp (months 1-3): amber tint
      const rampEnd = ri.rampEndIdx >= 0 ? ri.rampEndIdx : n;
      fillBand(ri.startIdx, rampEnd, isDkNow ? 'rgba(237,161,0,0.09)' : 'rgba(237,161,0,0.10)', 'Ramp (0%)');

      // Phase 3 — 50% phase (months 4-6): blue tint
      const fullStart = ri.fullIdx >= 0 ? ri.fullIdx : n;
      if (rampEnd < n) {
        fillBand(rampEnd, fullStart, isDkNow ? 'rgba(42,120,214,0.08)' : 'rgba(42,120,214,0.08)', '50% Target');
      }

      // Boundary lines
      function vline(idx, color, dash, label) {
        if (idx < 0 || idx >= n) return;
        const p = px(idx) - barW/2;
        c.save(); c.strokeStyle = color; c.lineWidth=2; c.setLineDash(dash);
        c.beginPath(); c.moveTo(p,top); c.lineTo(p,bottom); c.stroke();
        if (label) {
          c.fillStyle = color; c.font='10px system-ui'; c.textAlign='left';
          c.fillText(label, p+3, top+10);
        }
        c.restore();
      }

      vline(ri.startIdx,   isDkNow?'rgba(237,161,0,0.7)':'rgba(180,120,0,0.7)', [4,3], 'Start');
      vline(rampEnd,       isDkNow?'rgba(42,120,214,0.7)':'rgba(20,90,190,0.7)', [4,3], '50%');
      if (ri.fullIdx >= 0) vline(ri.fullIdx, isDkNow?'rgba(27,175,122,0.8)':'rgba(0,130,90,0.8)', [], '100%');
    }
  } : null;

  modalChart = new Chart(ctx, {
    type:'bar', data:{labels:D.month_labels, datasets},
    plugins: rampShadePlugin ? [rampShadePlugin] : [],
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        footer:items=>'Total: '+fmt(items.filter(i=>i.dataset.label!=='Monthly Target').reduce((s,i)=>s+(i.raw||0),0))+' hrs'
      }}},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{
          color:(ctx2)=>{
            if (!ri) return tickC;
            const i = ctx2.index;
            if (ri.startIdx >= 0 && i >= ri.startIdx && i < (ri.rampEndIdx>=0?ri.rampEndIdx:999))
              return isDkNow ? '#c98500' : '#8a6200';  // ramp = amber
            if (ri.rampEndIdx >= 0 && i >= ri.rampEndIdx && (ri.fullIdx<0||i<ri.fullIdx))
              return isDkNow ? '#5a9de8' : '#1458b8';  // 50% phase = blue
            if (ri.fullIdx >= 0 && i >= ri.fullIdx)
              return isDkNow ? '#199e70' : '#006b4a';  // full = green
            return tickC;
          },
          font:(ctx2)=>{
            if (!ri) return {size:11};
            const i = ctx2.index;
            const bold = i===ri.startIdx || i===ri.rampEndIdx || i===ri.fullIdx;
            return {size:11, weight: bold ? '700' : 'normal'};
          }
        }},
        y:{stacked:true,grid:{color:gridC},ticks:{color:tickC,font:{size:11}}}
      },
      onClick: onBarClick ? (evt, elems) => {
        if (elems.length > 0) onBarClick(elems[0].index);
      } : undefined
    }
  });
  if (onBarClick) {
    ctx.canvas.style.cursor = 'pointer';
    ctx.canvas.title = 'Click a bar to see campaign detail';
  }
  const C2 = COLORS();
  let legend = TYPES.map(t=>`<div class="legend-item"><div class="legend-dot" style="background:${C2[t]}"></div><span>${TYPE_LBL[t]}</span></div>`).join('')+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--c-target);border-radius:50%"></div><span>Monthly Target</span></div>'+
    (onBarClick ? '<div class="legend-item" style="color:var(--text3);font-size:11px;margin-left:8px">· click bar for campaigns</div>' : '');
  if (ri) {
    const rampLbl = ri.rampEndIdx >= 0 ? `${D.month_labels[ri.startIdx]}–${D.month_labels[Math.min(ri.rampEndIdx-1, D.fy_months.length-1)]}` : D.month_labels[ri.startIdx];
    const halfLbl = ri.rampEndIdx >= 0 && ri.fullIdx > ri.rampEndIdx ? `${D.month_labels[ri.rampEndIdx]}–${D.month_labels[Math.min(ri.fullIdx-1, D.fy_months.length-1)]}` : null;
    const fullLbl = ri.fullIdx >= 0 && ri.fullIdx < D.fy_months.length ? `from ${D.month_labels[ri.fullIdx]}` : null;
    legend += `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px">
      <span style="color:${isDkNow?'#c98500':'#8a6200'}">&#9644; Ramp 0% (${rampLbl})</span>
      ${halfLbl ? `<span style="color:${isDkNow?'#5a9de8':'#1458b8'}">&#9644; 50% target (${halfLbl})</span>` : ''}
      ${fullLbl ? `<span style="color:${isDkNow?'#199e70':'#006b4a'}">&#9475; 100% ${fullLbl}</span>` : '<span style="color:var(--text3)">100% target outside FY27</span>'}
    </div>`;
  }
  return legend;
}

function kpiTile(lbl, val, sub, color) {
  return `<div class="modal-kpi"><div class="lbl">${lbl}</div><div class="val" style="color:${color||'var(--text)'}">${val}</div><div class="sub">${sub}</div></div>`;
}

// ── Instructor modal ─────────────────────────────────────────────────────────
function openModal(inst) {
  const fyMonths = D.fy_months;
  const monthData = {};
  fyMonths.forEach(m => monthData[m] = {P:0,W:0,PW:0,B:0,T:0});
  for (const r of D.records) {
    if (r.i === inst.i && monthData[r.ym]) monthData[r.ym][r.t] = (monthData[r.ym][r.t]||0) + r.h;
  }
  const fyTarget = instTarget(inst, fyMonths);
  const tot = fyMonths.reduce((s,m)=>s+total(monthData[m]),0);
  const teach = fyMonths.reduce((s,m)=>s+TYPES.filter(t=>t!=='T').reduce((ss,t)=>ss+(monthData[m][t]||0),0),0);
  const trav = fyMonths.reduce((s,m)=>s+(monthData[m].T||0),0);
  const pct = fyTarget>0 ? tot/fyTarget*100 : 0;
  const today = new Date();
  const currYm = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  const elapsedMs = fyMonths.filter(m=>m<=currYm);
  const totYtd = elapsedMs.reduce((s,m)=>s+total(monthData[m]),0);
  const expectedByNow = elapsedMs.reduce((s,m)=>s+effectiveTarget(inst,m),0);
  const paceDelta = totYtd - expectedByNow;
  const paceColor = paceDelta>=0?'var(--on)':paceDelta>=-expectedByNow*0.1?'var(--risk)':'var(--behind)';
  const paceLabel = paceDelta>=0?'ahead of pace':paceDelta>=-expectedByNow*0.1?'slightly behind':'behind pace';
  const sColor = pct>=(PACE_FRAC['FY27'])*100*0.9?'var(--on)':pct>=(PACE_FRAC['FY27'])*100*0.7?'var(--risk)':'var(--behind)';
  const sLabel = pct>=(PACE_FRAC['FY27'])*100*0.9?'On pace':pct>=(PACE_FRAC['FY27'])*100*0.7?'At risk':'Behind';

  // Collect this instructor's camp records
  const instCamps = (D.camps || []).filter(c => c.i === inst.i);
  const hasCampDetail = instCamps.length > 0;

  const body = document.getElementById('modal-body');
  const paceSign = paceDelta>=0?'+':'';
  const ytdPct = expectedByNow>0 ? totYtd/expectedByNow*100 : 0;

  // ── Month to Plan ─────────────────────────────────────────────────────────
  // Window: all FY months from start up to current month, plus 4 months ahead
  const M2P_MONTHLY_TARGET = 100; // 1,200 hrs/yr ÷ 12
  const m2pWindow = [];
  const currYmIdx = fyMonths.indexOf(currYm);
  // All FY months from inst.start up to current month
  for (let i = 0; i <= Math.max(currYmIdx, 0) && i < fyMonths.length; i++) {
    m2pWindow.push({ ym: fyMonths[i], label: D.month_labels[i] });
  }
  // 4 months ahead, capped at end of FY
  const lastFyYm = fyMonths[fyMonths.length - 1];
  for (let ahead = 1; ahead <= 4; ahead++) {
    const base = currYmIdx >= 0 ? currYm : lastFyYm;
    const [yr, mo] = base.split('-').map(Number);
    const d2 = new Date(yr, mo - 1 + ahead, 1);
    const ym2 = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0');
    if (ym2 > lastFyYm) break; // stop at FY end
    const fyIdx = fyMonths.indexOf(ym2);
    m2pWindow.push({ ym: ym2, label: D.month_labels[fyIdx] });
  }

  // Build month-to-plan rows using string concatenation
  let m2pHtml = '';
  let m2pTotalHrs = 0, m2pMonthCount = 0;
  m2pWindow.forEach(({ ym: wym, label: wlbl }) => {
    let hrs = 0;
    const fyIdx2 = fyMonths.indexOf(wym);
    if (fyIdx2 >= 0) {
      hrs = total(monthData[wym]);
    } else {
      D.records.forEach(r => { if (r.i === inst.i && r.ym === wym && (!rawTeach || r.t !== 'T') ) hrs += rawTeach ? toRaw(r.h) : r.h; });
    }
    // Per-month target (handles ramp for new hires; used only for each bar's individual % fill)
    const mTarget = effectiveTarget(inst, wym) || (rawTeach ? MONTHLY_TARGET_RAW : M2P_MONTHLY_TARGET);
    const isPast = wym < currYm;
    const isCurr = wym === currYm;
    const statusLbl = isPast ? 'Completed' : (isCurr ? 'Current' : 'Planned');
    const statusColor = isPast ? 'var(--on)' : (isCurr ? '#0070d2' : '#898781');
    const barPct = mTarget > 0 ? Math.min(hrs / mTarget * 100, 100) : 0;
    const barColor = isPast ? (hrs >= mTarget * 0.9 ? 'var(--on)' : hrs >= mTarget * 0.7 ? 'var(--risk)' : 'var(--behind)') : '#0070d2';
    m2pTotalHrs += hrs;
    m2pMonthCount++;

    m2pHtml += '<div style="display:grid;grid-template-columns:80px 1fr 60px 70px;gap:8px;align-items:center;margin-bottom:8px">';
    m2pHtml += '<div style="font-size:12px;font-weight:600;color:var(--text2)">' + wlbl + '</div>';
    m2pHtml += '<div style="background:var(--border);border-radius:3px;height:8px;overflow:hidden">';
    m2pHtml += '<div style="height:100%;width:' + barPct.toFixed(1) + '%;background:' + barColor + ';border-radius:3px;transition:width 0.3s"></div></div>';
    m2pHtml += '<div style="font-size:12px;text-align:right;font-weight:600;color:' + barColor + '">' + fmt(hrs) + ' hrs</div>';
    m2pHtml += '<div style="font-size:11px;text-align:right;color:' + statusColor + ';font-weight:600">' + statusLbl + '</div>';
    m2pHtml += '</div>';
  });

  // Denominator: prorated annual target for the window months
  const m2pAnnualBase = 1200;
  const m2pProratedTarget = Math.round(m2pAnnualBase * m2pMonthCount / 12 * 10) / 10;
  const m2pPct = m2pProratedTarget > 0 ? m2pTotalHrs / m2pProratedTarget * 100 : 0;
  const m2pPctColor = m2pPct >= 90 ? 'var(--on)' : m2pPct >= 70 ? 'var(--risk)' : 'var(--behind)';

  let m2pSectionHtml = '';
  m2pSectionHtml += '<div style="margin-bottom:8px;margin-top:20px;display:flex;align-items:baseline;gap:10px">';
  m2pSectionHtml += '<span style="font-size:13px;font-weight:600;color:var(--text2)">Month to Plan</span>';
  m2pSectionHtml += '<span style="font-size:11px;color:var(--text3)">FY start → current + 4 months ahead · ' + m2pMonthCount + ' months · ' + (rawTeach ? fmt(MONTHLY_TARGET_RAW) : '100') + ' hrs/mo target</span>';
  m2pSectionHtml += '</div>';
  m2pSectionHtml += '<div style="background:var(--surface2,var(--surface));border:1px solid var(--border);border-radius:8px;padding:14px 16px">';
  m2pSectionHtml += m2pHtml;
  m2pSectionHtml += '<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">';
  m2pSectionHtml += '<div style="font-size:12px;color:var(--text3)">' + fmt(m2pTotalHrs) + ' hrs delivered &amp; planned / ' + fmt(m2pProratedTarget) + ' hrs prorated target (' + m2pAnnualBase + ' × ' + m2pMonthCount + '/12)</div>';
  m2pSectionHtml += '<div style="font-size:14px;font-weight:700;color:' + m2pPctColor + '">' + fmtPct(m2pPct) + ' of prorated target</div>';
  m2pSectionHtml += '</div></div>';

  body.innerHTML = `
    <div class="modal-kpis">
      <div class="modal-kpi"><div class="lbl">Pace vs Target (YTD)</div><div class="val" style="color:${paceColor}">${paceSign}${fmt(paceDelta)} hrs <span style="font-size:14px;font-weight:500">(${fmtPct(ytdPct)})</span></div><div class="sub">${fmt(expectedByNow)} hrs expected through ${D.month_labels[fyMonths.indexOf(elapsedMs[elapsedMs.length-1])]||currYm}</div></div>
      <div class="modal-kpi"><div class="lbl">Total Completed and Planned Hours / FY27 Target</div><div class="val" style="color:${sColor}">${fmt(tot)} <span style="font-size:14px;font-weight:500;color:var(--text2)">/ ${fmt(fyTarget)}</span></div><div class="sub">${fmtPct(pct)} of target · ${fmt(Math.max(0,fyTarget-tot))} remaining</div></div>
      ${kpiTile('Teaching + Prep', fmt(teach), fmt(trav)+' hrs travel', '')}
    </div>
    ${m2pSectionHtml}
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2);margin-top:20px">Monthly Breakdown — FY27</div>
    <div style="position:relative;height:240px"><canvas id="modal-chart"></canvas></div>
    <div class="legend-row" id="modal-legend" style="margin-top:10px;margin-bottom:4px"></div>
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Cumulative Hours vs Target — FY27</div>
    <div style="position:relative;height:160px"><canvas id="modal-chart-cum"></canvas></div>
    <div style="margin-top:6px;font-size:11px;color:var(--text3);display:flex;gap:14px">
      <span><span style="display:inline-block;width:18px;height:2px;background:#2a78d6;vertical-align:middle;margin-right:4px"></span>Actual</span>
      <span><span style="display:inline-block;width:18px;height:2px;background:#898781;vertical-align:middle;margin-right:4px;border-top:2px dashed #898781"></span>Target</span>
      <span style="margin-left:auto;color:var(--text3)">● = current month</span>
    </div>
    <div id="month-detail" style="margin-top:14px"></div>`;

  // Per-month target line: null (pre-join), 0 (ramp), 50 or 76.9 (50% phase), 100 or 76.9 (full)
  const monthTargets = fyMonths.map(m => {
    const t = effectiveTarget(inst, m);
    return m < inst.start ? null : t;
  });

  // Build ramp annotation info for the chart
  const rampInfo = inst.ramp_end ? {
    startIdx: fyMonths.indexOf(inst.start),
    rampEndIdx: fyMonths.indexOf(inst.ramp_end),          // start of 50% phase
    halfIdx: fyMonths.indexOf(inst.ramp_end),             // 50% phase start
    fullIdx: inst.full_start ? fyMonths.indexOf(inst.full_start) : -1  // 100% phase start
  } : (inst.start > '2026-02' ? {
    startIdx: fyMonths.indexOf(inst.start),
    rampEndIdx: fyMonths.indexOf(inst.start),
    halfIdx: -1,
    fullIdx: fyMonths.indexOf(inst.start)
  } : null);

  function showMonthCamps(monthIdx) {
    const ym = fyMonths[monthIdx];
    const label = D.month_labels[monthIdx];
    const monthCamps = instCamps.filter(c => c.ym === ym).sort((a,b) => b.h - a.h);
    const detail = document.getElementById('month-detail');
    if (!monthCamps.length) {
      detail.innerHTML = `<div style="color:var(--text3);font-size:12px;padding:10px 14px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">${label}: no Salesforce campaign data available for this month</div>`;
      detail.scrollIntoView({behavior:'smooth', block:'nearest'});
      return;
    }
    const C = COLORS();
    const rows = monthCamps.map(c =>
      `<tr>
        <td style="padding:6px 8px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)" title="${c.n}">${c.n}</td>
        <td style="padding:6px 8px;text-align:right;white-space:nowrap;color:var(--text2)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${C[c.t]};margin-right:4px;flex-shrink:0"></span>${TYPE_LBL[c.t]}</td>
        <td style="padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);white-space:nowrap">${fmt(c.h)} hrs</td>
      </tr>`
    ).join('');
    const total_h = monthCamps.reduce((s,c)=>s+c.h,0);
    detail.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:4px">
        <div style="padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13px;font-weight:700;color:var(--text)">${label} — Campaigns</span>
          <span style="font-size:11px;color:var(--text3)">${monthCamps.length} campaign${monthCamps.length!==1?'s':''} · ${fmt(total_h)} total hrs</span>
        </div>
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <thead><tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:6px 8px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px">Campaign</th>
            <th style="text-align:right;padding:6px 8px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px">Type</th>
            <th style="text-align:right;padding:6px 8px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px">Util Hrs</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr style="border-top:2px solid var(--border);background:var(--bg)">
            <td colspan="2" style="padding:7px 8px;font-weight:700;color:var(--text);font-size:12px">Total</td>
            <td style="padding:7px 8px;text-align:right;font-weight:700;color:var(--text);font-size:12px;font-variant-numeric:tabular-nums">${fmt(total_h)} hrs</td>
          </tr></tfoot>
        </table>
      </div>`;
    detail.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  document.getElementById('modal-legend').innerHTML = buildMonthlyChart('modal-chart', monthData, monthTargets, hasCampDetail ? showMonthCamps : null, rampInfo);

  // Cumulative burn-up chart
  (function() {
    const C = COLORS();
    const dk = document.documentElement.getAttribute('data-theme') === 'dark';
    const gridColor = dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
    const textColor = dk ? '#c3c2b7' : '#898781';
    let cumAct = 0, cumTgt = 0;
    const actData = [], tgtData = [], todayIdx = fyMonths.indexOf(currYm);
    fyMonths.forEach((m, idx) => {
      cumAct += total(monthData[m]);
      cumTgt += effectiveTarget(inst, m);
      actData.push(cumAct);
      tgtData.push(cumTgt);
    });
    const ctx2 = document.getElementById('modal-chart-cum').getContext('2d');
    new Chart(ctx2, {
      type: 'line',
      data: {
        labels: D.month_labels,
        datasets: [
          { label: 'Cumulative Actual', data: actData, borderColor: C.P, backgroundColor: 'transparent', borderWidth: 2, pointRadius: actData.map((_,i)=>i===todayIdx?6:2), pointBackgroundColor: actData.map((_,i)=>i===todayIdx?C.P:'transparent'), pointHoverRadius: 5, tension: 0.3 },
          { label: 'Cumulative Target', data: tgtData, borderColor: dk?'#c3c2b7':'#898781', backgroundColor: 'transparent', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { mode: 'index', intersect: false,
            callbacks: {
              title: items => {
                const lbl = items[0].label;
                return todayIdx >= 0 && items[0].dataIndex === todayIdx ? lbl + ' (current)' : lbl;
              },
              label: ctx => ctx.dataset.label + ': ' + fmt(ctx.parsed.y) + ' hrs'
            }
          }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 } } },
          y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, callback: v => fmt(v) }, beginAtZero: true }
        }
      }
    });
  })();

  // Banner if viewing a new hire while toggle is "off"
  if (hideNewHires && NEW_HIRE_IDXS.has(inst.i)) {
    const body2 = document.getElementById('modal-body');
    body2.insertAdjacentHTML('afterbegin',
      `<div style="background:rgba(237,161,0,0.12);border:1px solid rgba(237,161,0,0.35);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--text2);margin-bottom:14px">
        New hire — excluded from team targets while "New Hires: Removed" is active
      </div>`);
  }

  const nhLabel = inst.ramp_end
    ? ` · New hire ${MONTH_LABEL[inst.start]} · 50% from ${MONTH_LABEL[inst.ramp_end]}` +
      (inst.full_start && inst.full_start <= '2027-01' ? ` · 100% from ${MONTH_LABEL[inst.full_start]}` : ' · 100% in FY28')
    : (inst.start > '2026-02' ? ` · New hire ${MONTH_LABEL[inst.start]}` : '');
  showModal(inst.name, inst.region+' · '+inst.manager+nhLabel);
  const backBtn = document.getElementById('modal-back');
  if (currentManagerModal) {
    backBtn.style.display = 'flex';
  } else {
    backBtn.style.display = 'none';
  }
}

// ── Manager modal ────────────────────────────────────────────────────────────
function openManagerModal(mgr) {
  currentManagerModal = mgr;
  document.getElementById('modal-back').style.display = 'none';
  const fyMonths = D.fy_months;
  const team = activeInstructors().filter(i=>i.manager===mgr);
  const teamIdxs = new Set(team.map(i=>i.i));

  const monthData = {};
  fyMonths.forEach(m => monthData[m] = {P:0,W:0,PW:0,B:0,T:0});
  for (const r of D.records) {
    if (teamIdxs.has(r.i) && monthData[r.ym]) monthData[r.ym][r.t] = (monthData[r.ym][r.t]||0) + r.h;
  }

  // Per-instructor totals
  const byInst = {};
  for (const r of D.records) {
    if (teamIdxs.has(r.i)) {
      if (!byInst[r.i]) byInst[r.i] = {P:0,W:0,PW:0,B:0,T:0};
      byInst[r.i][r.t] = (byInst[r.i][r.t]||0) + r.h;
    }
  }

  const teamTarget = team.reduce((s,i)=>s+instTarget(i,fyMonths),0);
  const tot = fyMonths.reduce((s,m)=>s+total(monthData[m]),0);
  const pct = teamTarget>0 ? tot/teamTarget*100 : 0;
  const paceF = PACE_FRAC['FY27'];
  const sColor = pct>=paceF*100*0.9?'var(--on)':pct>=paceF*100*0.7?'var(--risk)':'var(--behind)';
  let onPace=0, atRisk=0, behind=0;
  team.forEach(inst => {
    const t = instTarget(inst,fyMonths); if(!t) return;
    const p = total(byInst[inst.i]||{})/t*100;
    if(p>=paceF*100*0.9) onPace++; else if(p>=paceF*100*0.7) atRisk++; else behind++;
  });

  // Team table rows
  const C = COLORS();
  const tableRows = team.map(inst => {
    const tm = byInst[inst.i]||{P:0,W:0,PW:0,B:0,T:0};
    const tot2 = total(tm);
    const tgt = instTarget(inst,fyMonths);
    const p = tgt>0?tot2/tgt*100:0;
    const sc = p>=paceF*100*0.9?'var(--on)':p>=paceF*100*0.7?'var(--risk)':'var(--behind)';
    return `<tr>
      <td><span class="name-link" data-inst-i="${inst.i}">${inst.name}</span></td>
      <td class="num">${tm.P>0?fmt(tm.P):''}</td>
      <td class="num">${tm.W>0?fmt(tm.W):''}</td>
      <td class="num">${tm.PW>0?fmt(tm.PW):''}</td>
      <td class="num">${tm.B>0?fmt(tm.B):''}</td>
      <td class="num">${tm.T>0?fmt(tm.T):''}</td>
      <td class="num total-bold">${fmt(tot2)}</td>
      <td class="num" style="color:${sc};font-weight:600">${tgt>0?fmtPct(p):''}</td>
      <td><div style="width:8px;height:8px;border-radius:50%;background:${sc};display:inline-block"></div></td>
    </tr>`;
  }).join('');

  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-kpis">
      ${kpiTile('Team Total Hrs', fmt(tot), tot>0?'FY27 to date':'No data', sColor)}
      ${kpiTile('Team Target', fmt(teamTarget), team.length+' instructors', '')}
      ${kpiTile('% of Target', fmtPct(pct), '', sColor)}
      ${kpiTile('On Pace', onPace+' / '+team.length, atRisk+' at risk · '+behind+' behind', '')}
    </div>
    <div style="margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text2)">Team Monthly Breakdown — FY27</div>
    <div style="position:relative;height:220px"><canvas id="modal-chart"></canvas></div>
    <div class="legend-row" id="modal-legend" style="margin-top:10px;margin-bottom:18px"></div>
    <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">Team Members</div>
    <table>
      <thead><tr>
        <th>Instructor</th><th class="num">Public</th><th class="num">Workshop</th>
        <th class="num">Priv WS</th><th class="num">Bootcamp</th><th class="num">Travel</th>
        <th class="num">Total</th><th class="num">%</th><th></th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>`;

  const monthTargets = fyMonths.map(m => team.reduce((s,i) => s + effectiveTarget(i,m), 0));
  document.getElementById('modal-legend').innerHTML = buildMonthlyChart('modal-chart', monthData, monthTargets);

  // Wire up name clicks to instructor modal
  body.querySelectorAll('.name-link').forEach(el=>{
    el.addEventListener('click',()=>openModal(INST_BY_IDX[+el.dataset.instI]));
  });

  showModal(mgr + ' — Team View', team.length+' instructors · '+[...new Set(team.map(i=>i.region))].join(', '));
}

// ── Events ──────────────────────────────────────────────────────────────────
document.getElementById('period-group').addEventListener('click', e => {
  const btn = e.target.closest('.period-btn');
  if (!btn) return;
  period = btn.dataset.period;
  regionFilter = null;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b===btn));
  render();
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));
    const months = getMonths(period);
    const byInst = aggByInst(months);
    renderTab(months,byInst);
  });
});
document.getElementById('modal-close').addEventListener('click',()=>closeModal());
document.getElementById('modal-back').addEventListener('click',()=>{
  if (modalChart) { modalChart.destroy(); modalChart=null; }
  const mgr = currentManagerModal;
  currentManagerModal = null;
  openManagerModal(mgr);
});
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if (e.target===e.currentTarget) {
    closeModal();
  }
});

document.getElementById('raw-btn').addEventListener('click',()=>{
  rawTeach = !rawTeach;
  const btn = document.getElementById('raw-btn');
  btn.textContent = rawTeach ? 'Util: Teaching Only' : 'Util: With Multiplier';
  btn.style.opacity = rawTeach ? '0.6' : '1';
  btn.title = rawTeach
    ? 'Showing raw teaching hours only (no 1.3× prep multiplier, no travel). Click to switch back.'
    : 'Showing utilization hours (1.3× prep multiplier + travel). Click to show teaching hours only.';
  render();
});

document.getElementById('nh-btn').addEventListener('click',()=>{
  hideNewHires = !hideNewHires;
  document.getElementById('nh-btn').textContent = hideNewHires ? 'New Hires: Removed' : 'New Hires: Remove';
  document.getElementById('nh-btn').style.opacity = hideNewHires ? '0.6' : '1';
  render();
});

document.getElementById('theme-btn').addEventListener('click',()=>{
  const isDk = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDk?'light':'dark');
  document.getElementById('theme-btn').textContent = isDk ? '\u263D Dark' : '\u2600 Light';
  render();
});

render();
</script>
</body>
</html>
