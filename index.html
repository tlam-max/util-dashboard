<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>T&amp;C Delivery Utilization — FY27</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f2f7;--surface:#fff;--border:#dde3ed;--text:#1a1a2e;--text2:#52514e;--text3:#8a8a9a;
  --header:#0a2463;--c-P:#2a78d6;--c-W:#6250d6;--c-PW:#eb6834;--c-B:#1baf7a;--c-T:#eda100;
  --c-target:#e04040;--on:#1baf7a;--risk:#eda100;--behind:#e04040;--radius:8px}
[data-theme=dark]{--bg:#111827;--surface:#1e2433;--border:#2e3a4e;--text:#f0efec;--text2:#c3c2b7;--text3:#7a7a8a;
  --header:#0a1a3a;--c-P:#3987e5;--c-W:#9085e9;--c-PW:#d95926;--c-B:#199e70;--c-T:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;
  background:var(--bg);color:var(--text);line-height:1.5}
.page{max-width:1200px;margin:0 auto;padding:0 16px 60px}
/* header */
header{background:var(--header);color:#fff;padding:16px 24px;margin-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700}
header p{font-size:12px;opacity:.7;margin-top:2px}
.period-group{display:flex;gap:4px;flex-wrap:wrap}
.period-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:5px 14px;border-radius:20px;cursor:pointer;font-size:13px;transition:.15s}
.period-btn:hover{background:rgba(255,255,255,.2)}
.period-btn.active{background:#fff;color:var(--header);font-weight:600}
.theme-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;color:var(--text)}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px}
.kpi-sub{font-size:12px;color:var(--text2);margin-top:4px}
.kpi-bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.kpi-bar{height:4px;border-radius:2px;transition:width .4s}
/* charts row */
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:800px){.charts-row{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card h3{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.chart-wrap{position:relative}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;
  padding:8px 18px;cursor:pointer;font-size:13px;color:var(--text2);transition:.15s}
.tab-btn.active{border-bottom-color:var(--c-P);color:var(--text);font-weight:600}
.tab-btn:hover{color:var(--text)}
/* section */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px}
/* horizontal bars */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar-label{width:140px;font-size:13px;font-weight:500;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;transition:width .4s;display:flex;align-items:center;gap:0}
.hbar-seg{height:100%;transition:width .4s}
.hbar-target{position:absolute;top:0;bottom:0;width:2px;background:var(--c-target);border-radius:1px;z-index:2}
.hbar-hrs{width:70px;text-align:right;font-size:12px;color:var(--text2);flex-shrink:0}
.hbar-pct{width:46px;text-align:right;font-size:11px;font-weight:600;flex-shrink:0}
/* table */
.tbl-controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search-box{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;
  background:var(--surface);color:var(--text);width:200px}
.filter-sel{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;
  background:var(--surface);color:var(--text);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg);padding:7px 8px;text-align:left;font-weight:600;color:var(--text2);
  border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--text)}
th.sorted{color:var(--c-P)}
td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.status-cell{display:flex;align-items:center;gap:5px}
.total-bold{font-weight:700}
.breadcrumb{font-size:12px;color:var(--text3);margin-bottom:12px;cursor:pointer}
.breadcrumb span{color:var(--c-P);text-decoration:underline}
/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:17px;font-weight:700;color:var(--text)}
.modal-meta{font-size:12px;color:var(--text2);margin-top:3px}
.modal-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-back{background:none;border:none;font-size:13px;color:var(--accent);cursor:pointer;padding:0;margin-bottom:4px;display:none;align-items:center;gap:4px}
.modal-back:hover{opacity:.75}
.modal-body{padding:20px 22px}
.modal-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.modal-kpi{background:var(--bg);border-radius:6px;padding:12px 14px}
.modal-kpi .val{font-size:22px;font-weight:800;color:var(--text);line-height:1}
.modal-kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px}
.modal-kpi .sub{font-size:11px;color:var(--text2);margin-top:3px}
.name-link{color:var(--c-P);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.name-link:hover{opacity:.8}
.filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.filter-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;
  font-size:12px;color:var(--text2);cursor:pointer;transition:.15s;display:flex;align-items:center;white-space:nowrap}
.filter-pill:hover{border-color:var(--c-P);color:var(--text)}
.filter-pill.active{background:var(--c-P);border-color:var(--c-P);color:#fff;font-weight:600}
</style>
</head>

<header>
  <div><h1>T&amp;C Delivery Utilization</h1><p>FY27 &middot; Feb 2026 &ndash; Jan 2027 &middot; Worldwide FTE Instructors</p></div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div class="period-group" id="period-group">
      <button class="period-btn active" data-period="FY27">FY27</button>
      <button class="period-btn" data-period="Q1">Q1</button>
      <button class="period-btn" data-period="Q2">Q2</button>
      <button class="period-btn" data-period="Q3">Q3</button>
      <button class="period-btn" data-period="Q4">Q4</button>

    <button class="theme-btn" id="nh-btn" title="Toggle new hire visibility">New Hires: Remove</button>
    <button class="theme-btn" id="theme-btn">&#9790; Dark</button>
  </div>
</header>

<div class="page">
  <div id="k-headline" style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px;padding:12px 16px;background:var(--surface);border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;gap:8px"></div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Total Util Hours</div><div style="display:flex;align-items:baseline;gap:6px"><div class="kpi-val" id="k-total">—</div><span id="k-total-pct" style="font-size:14px;font-weight:500;color:var(--text2)"></span></div><div class="kpi-sub" id="k-total-sub"></div><div class="kpi-bar-bg"><div class="kpi-bar" id="k-total-bar"></div></div></div>
    <div class="kpi"><div class="kpi-label">Avg / Instructor</div><div class="kpi-val" id="k-avg">—</div><div class="kpi-sub" id="k-avg-sub"></div><div class="kpi-bar-bg"><div class="kpi-bar" id="k-avg-bar"></div></div></div>
    <div class="kpi"><div class="kpi-label">% of Period Target</div><div class="kpi-val" id="k-pct">—</div><div class="kpi-sub" id="k-pct-sub"></div><div class="kpi-bar-bg"><div class="kpi-bar" id="k-pct-bar"></div></div></div>
    <div class="kpi"><div class="kpi-label">On Pace</div><div style="display:flex;align-items:baseline;gap:6px"><div class="kpi-val" id="k-pace">—</div><span id="k-pace-pct" style="font-size:14px;font-weight:500;color:var(--text2)"></span></div><div class="kpi-sub" id="k-pace-sub"></div><div class="kpi-bar-bg"><div class="kpi-bar" id="k-pace-bar"></div></div></div>
  </div>

  <div class="charts-row">
    <div class="card">
      <h3>Monthly Pace vs. Target — are we closing the gap?</h3>
      <div class="chart-wrap" style="height:260px"><canvas id="trend-chart"></canvas></div>
      <div class="legend-row" id="trend-legend"></div>
    </div>
    <div class="card">
      <h3>By Campaign Type</h3>
      <div class="chart-wrap" style="height:200px"><canvas id="type-chart"></canvas></div>
      <div class="legend-row" id="type-legend"></div>
    </div>
  </div>

  <div class="section">
    <div class="tabs">
      <button class="tab-btn active" data-tab="region">By Region</button>
      <button class="tab-btn" data-tab="manager">By Manager</button>
      <button class="tab-btn" data-tab="instructor">By Instructor</button>
      <button class="tab-btn" data-tab="cloud">By Cloud</button>
      <button class="tab-btn" data-tab="subco">By Subco</button>
      <button class="tab-btn" data-tab="impact">By Impact</button>
    </div>
    <div id="tab-content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <button class="modal-back" id="modal-back">&#8592; Back to team</button>
        <h2 id="modal-name"></h2><div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" id="modal-close">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

function getCourseCode(name) {
  // Match code embedded in a longer name (after dash/space/paren)
  const m = name.match(/[-\s(–—]([A-Z]{2,4}\d{3,4}[A-Z]?)(?:[-\s)–—]|$)/);
  if (m) return m[1];
  // Match name that IS the code (e.g. "TTD101", "ADX201-1", "CRT101J")
  const m2 = name.match(/^([A-Z]{2,4}\d{3,4}[A-Z]?)(?:[-J].*)?$/);
  return m2 ? m2[1] : null;
}
function getCloud(campName) {
  // Leave HOT records and bootcamp events as Other
  if (/AMER_HOT_|AMER_Bootcamp_|EMEA_Bootcamp_/.test(campName)) return 'Other';
  // Handle B2B / B2C prefixes (Commerce Cloud)
  if (/\bB2[BC]\d{3}/.test(campName)) return 'Commerce Cloud';
  const code = getCourseCode(campName);
  if (code) {
    // Special DEX split: DEX450, DEX602 = Platform; rest = MuleSoft
    if (code.startsWith('DEX')) return (code==='DEX450'||code==='DEX602') ? 'Platform' : 'MuleSoft';
    const prefix = code.match(/^[A-Z]+/)[0];
    const mapped = CLOUD_PREFIX_MAP[prefix];
    if (mapped) return mapped;
  }
  // Keyword fallback for full-name campaigns without a recognized code
  const n = campName;
  if (/Revenue Cloud|Revenue Management/i.test(n)) return 'Revenue Cloud';
  if (/Anypoint|MuleSoft/i.test(n)) return 'MuleSoft';
  if (/Data 360|Data 360|Data360/i.test(n)) return 'Data 360';
  if (/Health Cloud|Financial Services/i.test(n)) return 'Industries';
  if (/Agentforce/i.test(n)) return 'Agentforce';
  if (/Lightning Experience|New Admins/i.test(n)) return 'Platform';
  if (/Marketing Cloud|MCAE|Marketer/i.test(n)) return 'Marketing Cloud';
  if (/Tableau/i.test(n)) return 'Tableau';
  if (/Slack/i.test(n)) return 'Slack';
  return 'Other';
}

const NEW_HIRE_IDXS = new Set(D.instructors.filter(i=>i.ramp_end).map(i=>i.i));

function activeInstructors() {
  return hideNewHires ? D.instructors.filter(i=>!NEW_HIRE_IDXS.has(i.i)) : D.instructors;
}

function getMonths(p) {
  return p === 'FY27' ? D.fy_months : (D.quarters[p] || D.fy_months);
}

// Per-month target for one instructor: 0 (ramp), 50 (50% phase), 100 (full)
function monthlyTarget(inst, m) {
  if (!inst.ramp_end) {
    return m >= inst.start ? MONTHLY_TARGET : 0;
  }
  if (m < inst.ramp_end) return 0;                          // ramp (months 1-3)
  if (!inst.full_start || m < inst.full_start) return 50;   // 50% (months 4-6)
  return MONTHLY_TARGET;                                     // full (months 7+)
}

function instTarget(inst, months) {
  return months.reduce((s, m) => s + monthlyTarget(inst, m), 0);
}

function aggByInst(months) {
  const ms = new Set(months);
  const activeIdxs = new Set(activeInstructors().map(i=>i.i));
  const res = {};
  for (const r of D.records) {
    if (!ms.has(r.ym)) continue;
    if (!activeIdxs.has(r.i)) continue;
    if (!res[r.i]) res[r.i] = {P:0,W:0,PW:0,B:0,T:0};
    res[r.i][r.t] = (res[r.i][r.t]||0) + r.h;
  }
  return res;
}

function total(tm) {
  if (!tm) return 0;
  return TYPES.reduce((s,t) => s+(tm[t]||0), 0);
}

function barColor(pct) {
  return pct >= 90 ? 'var(--on)' : pct >= 70 ? 'var(--risk)' : 'var(--behind)';
}

function fmt(n) { return Math.round(n).toLocaleString(); }
function fmtPct(n) { return Math.round(n) + '%'; }

  const active = activeInstructors().filter(i => instTarget(i, months) > 0);
  const teamTarget = active.reduce((s,i) => s+instTarget(i,months), 0);
  const totalHrs = Object.values(byInst).reduce((s,tm) => s+total(tm), 0);
  const pct = teamTarget > 0 ? totalHrs/teamTarget*100 : 0;
  const avg = active.length > 0 ? totalHrs/active.length : 0;
  const periodTarget = months.length * MONTHLY_TARGET; // per instructor
  const avgPct = periodTarget > 0 ? avg/periodTarget*100 : 0;

  const paceF = PACE_FRAC[period] || 1;
  let onPace=0, atRisk=0, behind=0;
  for (const inst of active) {
    const t = instTarget(inst,months);
    if (t===0) continue;
    const instPct = total(byInst[inst.i]||{})/t*100;
    const threshold = paceF*100;
    if (instPct >= threshold*0.9) onPace++;
    else if (instPct >= threshold*0.7) atRisk++;
    else behind++;
  }
  const pacePct = active.length > 0 ? onPace/active.length*100 : 0;

  const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  const setW = (id,v) => { const el=document.getElementById(id); if(el) el.style.width=v; };
  const setBg = (id,v) => { const el=document.getElementById(id); if(el) el.style.background=v; };

  set('k-total', fmt(totalHrs));
  set('k-total-pct', fmtPct(pct));
  const remaining = Math.max(0, teamTarget - totalHrs);
  set('k-total-sub', fmt(teamTarget)+' target · '+fmt(remaining)+' hrs to go');
  setW('k-total-bar', Math.min(100,pct)+'%');
  setBg('k-total-bar', barColor(pct));

  set('k-avg', fmt(avg));
  set('k-avg-sub', 'Target '+fmt(periodTarget)+' hrs / period');
  setW('k-avg-bar', Math.min(100,avgPct)+'%');
  setBg('k-avg-bar', barColor(avgPct));

  set('k-pct', fmtPct(pct));
  set('k-pct-sub', fmt(totalHrs)+' / '+fmt(teamTarget)+' hrs');
  setW('k-pct-bar', Math.min(100,pct)+'%');
  setBg('k-pct-bar', barColor(pct));

  set('k-pace', onPace+' / '+active.length);
  set('k-pace-pct', fmtPct(pacePct));
  set('k-pace-sub', atRisk+' at risk · '+behind+' behind');
  setW('k-pace-bar', Math.min(100,pacePct)+'%');
  setBg('k-pace-bar', barColor(pacePct));

  // Headline insight
  const hl = document.getElementById('k-headline');
  if (hl) {
    const statusColor = pct>=75*0.9?'var(--on)':pct>=75*0.7?'var(--risk)':'var(--behind)';
    hl.innerHTML = `<span style="color:${statusColor}">&#9679;</span>&nbsp;Team is <span style="color:${statusColor}">${fmtPct(pct)}</span> of ${period} target &nbsp;·&nbsp; <span style="color:var(--on)">${onPace}</span> of ${active.length} instructors on pace`;
  }
}

// ── Trend Chart ─────────────────────────────────────────────────────────────
function renderTrend(months) {
  const C = COLORS();
  const monthData = {};
  months.forEach(m => monthData[m] = {P:0,W:0,PW:0,B:0,T:0});
  for (const r of D.records) {
    if (monthData[r.ym] !== undefined) {
      monthData[r.ym][r.t] = (monthData[r.ym][r.t]||0) + r.h;
    }
  }
  const labels = months.map(m => MONTH_LABEL[m]);
  const targets = months.map(m => activeInstructors().reduce((s,i) => s + monthlyTarget(i,m), 0));

  const datasets = TYPES.map(t => ({
    label: TYPE_LBL[t], data: months.map(m => Math.round(monthData[m][t]||0)),
    backgroundColor: C[t], stack:'s', borderWidth:0, borderRadius:2
  }));
  datasets.push({
    label:'Monthly Target', data:targets, type:'line',
    borderColor:'var(--c-target)', borderWidth:2, borderDash:[5,3],
    pointRadius:0, fill:false, stack:undefined, order:-1
  });

  const isDk = document.documentElement.getAttribute('data-theme')==='dark';
  const gridC = isDk ? '#2e3a4e':'#e2e6ed';
  const tickC = isDk ? '#c3c2b7':'#52514e';

  const ctx = document.getElementById('trend-chart').getContext('2d');
  if (tChart) tChart.destroy();
  tChart = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{
          footer: items => 'Total: '+fmt(items.filter(i=>i.dataset.label!=='Monthly Target').reduce((s,i)=>s+(i.raw||0),0))+' hrs'
        }}},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{color:tickC,font:{size:11}}},
        y:{stacked:true,grid:{color:gridC},ticks:{color:tickC,font:{size:11}},
          title:{display:true,text:'Hours',color:tickC,font:{size:11}}}

    }
  });
  document.getElementById('trend-legend').innerHTML =
    TYPES.map(t=>`<div class="legend-item"><div class="legend-dot" style="background:${C[t]}"></div><span>${TYPE_LBL[t]}</span></div>`).join('')+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--c-target);border-radius:50%"></div><span>Monthly Target</span></div>';
}

// ── Horizontal bar helper ────────────────────────────────────────────────────
function renderHBars(container, rows) {
  // rows: [{label, typeMap, target, onClick?}]
  const C = COLORS();
  const maxHrs = Math.max(...rows.map(r=>total(r.typeMap)), 1);
  const trackMax = Math.max(maxHrs, ...rows.map(r=>r.target||0)) * 1.05;

  container.innerHTML = rows.map((row,idx) => {
    const tot = total(row.typeMap);
    const tgt = row.target || 0;
    const pct = tgt > 0 ? tot/tgt*100 : 0;
    const targetPct = tgt > 0 ? Math.min(98, tgt/trackMax*100) : 0;
    const segs = TYPES.map(t => {
      const segW = trackMax>0 ? (row.typeMap[t]||0)/trackMax*100 : 0;
      return segW > 0.2 ? `<div class="hbar-seg" style="width:${segW.toFixed(1)}%;background:${C[t]}" title="${TYPE_LBL[t]}: ${fmt(row.typeMap[t]||0)} hrs"></div>` : '';
    }).join('');
    const color = barColor(pct);
    const clickAttr = row.onClick ? `data-idx="${idx}" style="cursor:pointer"` : '';
    return `<div class="hbar-row" ${clickAttr}>
      <div class="hbar-label" title="${row.label}">${row.label}</div>
      <div class="hbar-track">
        <div class="hbar-fill">${segs}</div>
        ${tgt>0 ? `<div class="hbar-target" style="left:${targetPct.toFixed(1)}%" title="Target: ${fmt(tgt)} hrs"><span style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);white-space:nowrap;font-weight:500">Target</span></div>` : ''}
      </div>
      <div class="hbar-hrs">${fmt(tot)}</div>
      <div class="hbar-pct" style="color:${color}">${tgt>0?fmtPct(pct):''}</div>
    </div>`;
  }).join('');

  if (rows.some(r=>r.onClick)) {
    container.querySelectorAll('[data-idx]').forEach(el => {
      el.addEventListener('click', () => rows[+el.dataset.idx].onClick());
    });
  }
}

// ── Sparkline helper ─────────────────────────────────────────────────────────
function sparkline(instI, recentMonths) {
  const C = COLORS();
  const vals = recentMonths.map(m => {
    let h = 0;
    for (const r of D.records) { if (r.i===instI && r.ym===m) h += r.h; }
    return h;
  });
  const maxV = Math.max(...vals, 1);
  const W = 48, H = 20, pad = 2;
  const pts = vals.map((v,i) => {
    const x = pad + (i/(vals.length-1||1)) * (W-pad*2);
    const y = H - pad - (v/maxV)*(H-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const dk = document.documentElement.getAttribute('data-theme')==='dark';
  const lineColor = dk ? '#3987e5' : '#2a78d6';
  return `<svg width="${W}" height="${H}" style="display:block"><polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>{
    const x = pad+(i/(vals.length-1||1))*(W-pad*2); const y=H-pad-(v/maxV)*(H-pad*2);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${lineColor}"/>`;
  }).join('')}</svg>`;
}

// ── Instructor tab ──────────────────────────────────────────────────────────
function renderInstructor(months, byInst) {
  const div = document.getElementById('tab-content');
  div.innerHTML = `
    <div class="tbl-controls">
      <input class="search-box" id="inst-search" placeholder="Search instructor..." value="${searchQ}">
      <select class="filter-sel" id="region-sel">
        <option value="ALL">All Regions</option>
        ${['AMER','EMEA','APAC','LATAM'].map(r=>`<option value="${r}" ${regionDropdown===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
    <div id="inst-table-wrap"></div>`;

  document.getElementById('inst-search').addEventListener('input', e=>{ searchQ=e.target.value; renderInstructor(months,byInst); });
  document.getElementById('region-sel').addEventListener('change', e=>{ regionDropdown=e.target.value; renderInstructor(months,byInst); });

  const paceF = PACE_FRAC[period]||1;
  let rows = activeInstructors().map(inst => {
    const tm = byInst[inst.i] || {P:0,W:0,PW:0,B:0,T:0};
    const tot = total(tm);
    const tgt = instTarget(inst,months);
    const pct = tgt>0 ? tot/tgt*100 : 0;
    const threshold = paceF*100;
    const status = pct>=threshold*0.9 ? 'on' : pct>=threshold*0.7 ? 'risk' : 'behind';
    return {...inst, tm, tot, tgt, pct, status};
  });

  if (searchQ) rows = rows.filter(r=>r.name.toLowerCase().includes(searchQ.toLowerCase()));
  if (regionDropdown!=='ALL') rows = rows.filter(r=>r.region===regionDropdown);

  rows.sort((a,b) => {
    const av = sortKey==='name'?a.name:sortKey==='pct'?a.pct:sortKey==='tgt'?a.tgt:(a.tm[sortKey]!==undefined?a.tm[sortKey]:a[sortKey])||0;
    const bv = sortKey==='name'?b.name:sortKey==='pct'?b.pct:sortKey==='tgt'?b.tgt:(b.tm[sortKey]!==undefined?b.tm[sortKey]:b[sortKey])||0;
    if (typeof av==='string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av-bv : bv-av;
  });

  const C = COLORS();
  const fyMonths = D.fy_months;
  const today2 = new Date();
  const currYm2 = today2.getFullYear()+'-'+String(today2.getMonth()+1).padStart(2,'0');
  const allElapsed = fyMonths.filter(m=>m<=currYm2);
  const recentMonths = allElapsed.slice(-3);
  const cols = [{k:'name',l:'Instructor'},{k:'region',l:'Region'},{k:'manager',l:'Manager'},
    {k:'P',l:'Public'},{k:'W',l:'Workshop'},{k:'PW',l:'Priv WS'},{k:'B',l:'Bootcamp'},{k:'T',l:'Travel'},
    {k:'total',l:'Total'},{k:'tgt',l:'Target'},{k:'pct',l:'%'},{k:'spark',l:'3mo Trend'},{k:'status',l:''}];

  const headers = cols.map(c=>`<th class="${sortKey===c.k?'sorted':''}" data-k="${c.k}">${c.l}${sortKey===c.k?(sortAsc?' ▲':' ▼'):''}</th>`).join('');

  const tableRows = rows.map(r => {
    const dotColor = r.status==='on'?'var(--on)':r.status==='risk'?'var(--risk)':'var(--behind)';
    const label = r.status==='on'?'On pace':r.status==='risk'?'At risk':'Behind';
    return `<tr>
      <td><span class="name-link" data-inst-i="${r.i}">${r.name}</span></td><td>${r.region}</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.manager}">${r.manager}</td>
      <td class="num">${r.tm.P>0?fmt(r.tm.P):''}</td>
      <td class="num">${r.tm.W>0?fmt(r.tm.W):''}</td>
      <td class="num">${r.tm.PW>0?fmt(r.tm.PW):''}</td>
      <td class="num">${r.tm.B>0?fmt(r.tm.B):''}</td>
      <td class="num">${r.tm.T>0?fmt(r.tm.T):''}</td>
      <td class="num total-bold">${fmt(r.tot)}</td>
      <td class="num">${fmt(r.tgt)}</td>
      <td class="num" style="color:${barColor(r.pct)};font-weight:600">${fmtPct(r.pct)}</td>
      <td style="padding:4px 8px">${recentMonths.length>=2 ? sparkline(r.i, recentMonths) : ''}</td>
      <td><div class="status-cell"><div class="dot" style="background:${dotColor}"></div><span style="color:${dotColor};font-size:11px">${label}</span></div></td>
    </tr>`;
  }).join('');

  document.getElementById('inst-table-wrap').innerHTML =
    `<table><thead><tr>${headers}</tr></thead><tbody>${tableRows}</tbody></table>`;
  document.querySelectorAll('#inst-table-wrap th').forEach(th=>{
    th.addEventListener('click',()=>{ if(sortKey===th.dataset.k) sortAsc=!sortAsc; else{sortKey=th.dataset.k;sortAsc=false;} renderInstructor(months,byInst); });
  });
  document.querySelectorAll('.name-link').forEach(el=>{
    el.addEventListener('click',()=>{ openModal(INST_BY_IDX[+el.dataset.instI]); });
  });
}

// ── Cloud tab ────────────────────────────────────────────────────────────────
function renderCloud() {
  const div = document.getElementById('tab-content');
  const camps = D.camps || [];
  if (!camps.length) {
    div.innerHTML = '<p style="color:var(--text3);padding:20px">No campaign data available.</p>';
    return;
  }

  // Filter camps by current period
  const periodMonths = new Set(getMonths(period));
  const filteredCamps = camps.filter(c => periodMonths.has(c.ym));

  // Aggregate hours by cloud, course, and instructor
  const cloudHrs = {}, cloudCourses = {}, cloudInstructors = {};
  // cloudDelivery[cloud] = {course: hrs, workshop: hrs}
  const cloudDelivery = {};
  // instCloudHrs[instIdx][cloud] = hrs — for "By Instructor" view
  const instCloudHrs = {};
  let cloudCampNames = {};

  const WS_TYPES = new Set(['W','PW']);

  for (const c of filteredCamps) {
    const cloud = getCloud(c.n);
    const code = getCourseCode(c.n) || 'Other';
    cloudHrs[cloud] = (cloudHrs[cloud]||0) + c.h;

    if (!cloudCourses[cloud]) cloudCourses[cloud] = {};
    cloudCourses[cloud][code] = (cloudCourses[cloud][code]||0) + c.h;

    if (!cloudInstructors[cloud]) cloudInstructors[cloud] = {};
    cloudInstructors[cloud][c.i] = (cloudInstructors[cloud][c.i]||0) + c.h;

    if (!cloudDelivery[cloud]) cloudDelivery[cloud] = {course:0, workshop:0};
    if (WS_TYPES.has(c.t)) cloudDelivery[cloud].workshop += c.h;
    else cloudDelivery[cloud].course += c.h;

    if (!instCloudHrs[c.i]) instCloudHrs[c.i] = {};
    instCloudHrs[c.i][cloud] = (instCloudHrs[c.i][cloud]||0) + c.h;

    // Track full campaign names for Other (for monitoring panel)
    if (cloud === 'Other') {
      if (!cloudCampNames) cloudCampNames = {};
      cloudCampNames[c.n] = (cloudCampNames[c.n]||0) + c.h;
    }
  }

  const grandTotal = Object.values(cloudHrs).reduce((s,v)=>s+v,0);
  const clouds = CLOUD_ORDER.filter(c => cloudHrs[c]);

  // ── "By Cloud" panel ──────────────────────────────────────────────────────
  function buildCloudPanel() {
    const maxHrs = clouds.length ? Math.max(...clouds.map(c=>cloudHrs[c])) : 1;
    const cloudRows = clouds.map(cloud => {
      const hrs = cloudHrs[cloud];
      const pct = grandTotal > 0 ? hrs/grandTotal*100 : 0;
      const barW = maxHrs > 0 ? hrs/maxHrs*100 : 0;
      const color = CLOUD_COLORS[cloud] || CLOUD_COLORS.Other;
      const del = cloudDelivery[cloud] || {course:0,workshop:0};
      // Stacked bar: Course (solid) | Workshop (lighter)
      const courseW = hrs > 0 ? del.course/hrs*100 : 0;
      const wsW = hrs > 0 ? del.workshop/hrs*100 : 0;
      const topCourses = Object.entries(cloudCourses[cloud])
        .sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([code,h])=>`<span style="background:var(--bg);border-radius:3px;padding:1px 5px;font-size:10px;margin-right:4px">${code} <span style="color:var(--text3)">${fmt(h)}h</span></span>`).join('');
      return `<div class="hbar-row" data-cloud="${cloud}" style="cursor:pointer;margin-bottom:14px">
        <div class="hbar-label" style="width:130px;font-weight:600" title="${cloud}">${cloud}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex">
              <div title="Course: ${fmt(del.course)} hrs" style="height:100%;width:${(barW*courseW/100).toFixed(2)}%;background:${color};opacity:0.92;flex-shrink:0"></div>
              <div title="Workshop: ${fmt(del.workshop)} hrs" style="height:100%;width:${(barW*wsW/100).toFixed(2)}%;background:${color};opacity:0.42;flex-shrink:0"></div>
            </div>
            <div style="width:70px;text-align:right;font-size:12px;color:var(--text2)">${fmt(hrs)}</div>
            <div style="width:40px;text-align:right;font-size:11px;font-weight:600;color:${color}">${fmtPct(pct)}</div>
          </div>
          <div style="display:flex;gap:10px;padding-left:2px;margin-bottom:2px">
            <span style="font-size:10px;color:var(--text2)"><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:${color};opacity:0.92;margin-right:3px;vertical-align:middle"></span>Course ${fmt(del.course)} h (${fmtPct(courseW)})</span>
            <span style="font-size:10px;color:var(--text2)"><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:${color};opacity:0.42;margin-right:3px;vertical-align:middle"></span>Workshop ${fmt(del.workshop)} h (${fmtPct(wsW)})</span>
          </div>
          <div style="padding-left:2px">${topCourses}</div>
        </div>
      </div>`;
    }).join('');

    return `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px">Hours by Cloud</div>
          <div id="cloud-bars">${cloudRows}</div>
        </div>
        <div id="cloud-detail" style="min-height:200px">
          <div style="font-size:12px;color:var(--text3);padding-top:40px;text-align:center">← Click a cloud to see courses &amp; instructors</div>
        </div>
      </div>`;
  }

  // ── "By Instructor" panel ─────────────────────────────────────────────────
  function buildInstructorPanel() {
    // Build instructor rows sorted by total cloud hours desc
    const instMap = {};
    D.instructors.forEach(inst => { instMap[inst.i] = inst; });
    const instRows = Object.entries(instCloudHrs)
      .map(([iStr, cloudMap]) => {
        const inst = instMap[parseInt(iStr)];
        if (!inst) return null;
        const total = Object.values(cloudMap).reduce((s,v)=>s+v,0);
        return { inst, cloudMap, total };
      })
      .filter(Boolean)
      .sort((a,b) => b.total - a.total);

    if (!instRows.length) return '<p style="color:var(--text3);padding:20px">No data for this period.</p>';

    // Determine which clouds appear (ordered)
    const activeClouds = CLOUD_ORDER.filter(c => clouds.includes(c));

    // Build stacked bar for each instructor
    const maxTotal = instRows[0].total;
    const rows = instRows.map(({inst, cloudMap, total}) => {
      const barW = maxTotal > 0 ? total/maxTotal*100 : 0;
      // Stacked segments
      let segments = '';
      let cumPct = 0;
      activeClouds.forEach(cloud => {
        const h = cloudMap[cloud] || 0;
        if (!h) return;
        const segW = total > 0 ? h/total*100 : 0;
        const color = CLOUD_COLORS[cloud] || CLOUD_COLORS.Other;
        segments += `<div title="${cloud}: ${fmt(h)} hrs" style="height:100%;width:${segW.toFixed(2)}%;background:${color};flex-shrink:0"></div>`;
        cumPct += segW;
      });
      // Cloud dot legend for this instructor
      const dots = activeClouds.filter(c => cloudMap[c]).map(c => {
        const color = CLOUD_COLORS[c] || CLOUD_COLORS.Other;
        return `<span title="${c}: ${fmt(cloudMap[c])} hrs" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:2px"></span>`;
      }).join('');

      return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:140px;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${inst.name}">${inst.name}</div>
        <div style="flex:1;height:18px;background:var(--bg);border-radius:3px;overflow:hidden;display:flex" data-inst="${inst.i}" style="cursor:pointer">
          <div style="display:flex;width:${barW.toFixed(1)}%;height:100%">${segments}</div>
        </div>
        <div style="width:52px;text-align:right;font-size:11px;color:var(--text2)">${fmt(total)} hrs</div>
        <div style="width:60px;display:flex;gap:2px;align-items:center">${dots}</div>
      </div>`;
    }).join('');

    // Legend
    const legend = activeClouds.map(c => {
      const color = CLOUD_COLORS[c] || CLOUD_COLORS.Other;
      return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:11px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>${c}</span>`;
    }).join('');

    return `
      <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px">${legend}</div>
      <div>${rows}</div>`;
  }

  // ── "By Region" panel ────────────────────────────────────────────────────
  function buildRegionPanel() {
    const instMap = {};
    D.instructors.forEach(inst => { instMap[inst.i] = inst; });
    // regionCloudHrs[region][cloud] = hrs
    const regionCloudHrs = {}, regionTotals = {}, regionDelivery = {};
    for (const c of filteredCamps) {
      const inst = instMap[c.i];
      if (!inst) continue;
      const region = inst.region || 'Unknown';
      const cloud = getCloud(c.n);
      if (!regionCloudHrs[region]) regionCloudHrs[region] = {};
      regionCloudHrs[region][cloud] = (regionCloudHrs[region][cloud]||0) + c.h;
      regionTotals[region] = (regionTotals[region]||0) + c.h;
      if (!regionDelivery[region]) regionDelivery[region] = {course:0,workshop:0};
      if (WS_TYPES.has(c.t)) regionDelivery[region].workshop += c.h;
      else regionDelivery[region].course += c.h;
    }
    const regions = Object.keys(regionTotals).sort((a,b)=>regionTotals[b]-regionTotals[a]);
    if (!regions.length) return '<p style="color:var(--text3);padding:20px">No data for this period.</p>';
    const maxR = regionTotals[regions[0]];
    const activeClouds = CLOUD_ORDER.filter(c => clouds.includes(c));
    const legend = activeClouds.map(c => {
      const color = CLOUD_COLORS[c] || CLOUD_COLORS.Other;
      return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:11px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>${c}</span>`;
    }).join('');
    const rows = regions.map(region => {
      const total = regionTotals[region];
      const barW = maxR>0 ? total/maxR*100 : 0;
      const cmap = regionCloudHrs[region]||{};
      const del = regionDelivery[region]||{course:0,workshop:0};
      let segs = '';
      activeClouds.forEach(cloud => {
        const h = cmap[cloud]||0;
        if (!h) return;
        const segW = total>0 ? h/total*100 : 0;
        const color = CLOUD_COLORS[cloud]||CLOUD_COLORS.Other;
        segs += `<div title="${cloud}: ${fmt(h)} hrs" style="height:100%;width:${segW.toFixed(2)}%;background:${color};flex-shrink:0"></div>`;
      });
      return `<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px">
          <div style="width:60px;font-size:12px;font-weight:700;color:var(--text)">${region}</div>
          <div style="flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex">
            <div style="display:flex;width:${barW.toFixed(1)}%;height:100%">${segs}</div>
          </div>
          <div style="width:62px;text-align:right;font-size:12px;color:var(--text2)">${fmt(total)} hrs</div>
        </div>
        <div style="display:flex;gap:10px;padding-left:70px;font-size:10px;color:var(--text3)">
          <span>Course ${fmt(del.course)} h (${fmtPct(total>0?del.course/total*100:0)})</span>
          <span>Workshop ${fmt(del.workshop)} h (${fmtPct(total>0?del.workshop/total*100:0)})</span>
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px">${legend}</div><div>${rows}</div>`;
  }

  // ── "By Manager" panel ────────────────────────────────────────────────────
  function buildManagerPanel() {
    // Build from full instructor roster (same source as the main By Manager tab)
    const instMap = {};
    D.instructors.forEach(inst => { instMap[inst.i] = inst; });

    // Pre-aggregate cloud hours from camps by instructor index
    const mgrCloudHrs = {}, mgrTotals = {}, mgrDelivery = {};

    // Seed every manager that exists in the instructor list so all appear
    const allMgrs = [...new Set(D.instructors.map(i => i.manager || 'Unassigned'))];
    allMgrs.forEach(mgr => {
      mgrCloudHrs[mgr] = {};
      mgrTotals[mgr] = 0;
      mgrDelivery[mgr] = {course:0, workshop:0};
    });

    for (const c of filteredCamps) {
      const inst = instMap[c.i];
      if (!inst) continue;
      const mgr = inst.manager || 'Unassigned';
      const cloud = getCloud(c.n);
      mgrCloudHrs[mgr][cloud] = (mgrCloudHrs[mgr][cloud]||0) + c.h;
      mgrTotals[mgr] += c.h;
      if (WS_TYPES.has(c.t)) mgrDelivery[mgr].workshop += c.h;
      else mgrDelivery[mgr].course += c.h;
    }

    // Sort by total hours desc; managers with 0 go to bottom
    const mgrs = allMgrs.sort((a,b) => mgrTotals[b] - mgrTotals[a]);
    const maxM = Math.max(...mgrs.map(m => mgrTotals[m]), 1);
    const activeClouds = CLOUD_ORDER.filter(c => clouds.includes(c));

    const legend = activeClouds.map(c => {
      const color = CLOUD_COLORS[c] || CLOUD_COLORS.Other;
      return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:11px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>${c}</span>`;
    }).join('');

    const rows = mgrs.map(mgr => {
      const total = mgrTotals[mgr];
      const barW = maxM>0 ? total/maxM*100 : 0;
      const cmap = mgrCloudHrs[mgr]||{};
      const del = mgrDelivery[mgr];
      const teamSize = D.instructors.filter(i=>(i.manager||'Unassigned')===mgr).length;
      let segs = '';
      activeClouds.forEach(cloud => {
        const h = cmap[cloud]||0;
        if (!h) return;
        const segW = total>0 ? h/total*100 : 0;
        const color = CLOUD_COLORS[cloud]||CLOUD_COLORS.Other;
        segs += `<div title="${cloud}: ${fmt(h)} hrs" style="height:100%;width:${segW.toFixed(2)}%;background:${color};flex-shrink:0"></div>`;
      });
      const noData = total === 0;
      return `<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px">
          <div style="width:110px;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${mgr}">${mgr.split(' ')[0]} <span style="font-weight:400;color:var(--text3)">(${teamSize})</span></div>
          <div style="flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex">
            ${noData
              ? `<div style="width:100%;height:100%;display:flex;align-items:center;padding-left:8px"><span style="font-size:10px;color:var(--text3);font-style:italic">No AMER campaign data</span></div>`
              : `<div style="display:flex;width:${barW.toFixed(1)}%;height:100%">${segs}</div>`
            }
          </div>
          <div style="width:62px;text-align:right;font-size:12px;color:${noData?'var(--text3)':'var(--text2)'}">${noData ? '—' : fmt(total)+' hrs'}</div>
        </div>
        ${!noData ? `<div style="display:flex;gap:10px;padding-left:120px;font-size:10px;color:var(--text3)">
          <span>Course ${fmt(del.course)} h (${fmtPct(total>0?del.course/total*100:0)})</span>
          <span>Workshop ${fmt(del.workshop)} h (${fmtPct(total>0?del.workshop/total*100:0)})</span>
        </div>` : ''}
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px">${legend}</div><div>${rows}</div>`;
  }

  // ── Wire up sub-view toggle ───────────────────────────────────────────────
  let cloudSubView = 'cloud'; // 'cloud' | 'instructor' | 'region' | 'manager'

  const SUB_VIEWS = [
    {id:'cloud', label:'By Cloud'},
    {id:'instructor', label:'By Instructor'},
    {id:'region', label:'By Region'},
    {id:'manager', label:'By Manager'},
  ];

  function buildHTML() {
    const content = cloudSubView === 'cloud' ? buildCloudPanel()
                  : cloudSubView === 'instructor' ? buildInstructorPanel()
                  : cloudSubView === 'region' ? buildRegionPanel()
                  : buildManagerPanel();
    const tabs = SUB_VIEWS.map(v =>
      `<button id="csub-${v.id}" style="padding:4px 12px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;background:${cloudSubView===v.id?'var(--accent)':'var(--bg)'};color:${cloudSubView===v.id?'#fff':'var(--text2)'}">${v.label}</button>`
    ).join('');
    return `
      <p style="font-size:12px;color:var(--text3);margin-bottom:12px;font-style:italic">AMER campaign data only · ${fmt(grandTotal)} total hrs in ${period}</p>
      <div style="display:flex;gap:6px;margin-bottom:16px">${tabs}</div>
      <div id="cloud-sub-content">${content}</div>`;
  }

  div.innerHTML = buildHTML();

  function rebind() {
    SUB_VIEWS.forEach(v => {
      const btn = div.querySelector(`#csub-${v.id}`);
      if (btn) btn.addEventListener('click', () => { cloudSubView=v.id; div.innerHTML=buildHTML(); rebind(); });
    });

    if (cloudSubView === 'cloud') {
      // Wire cloud bar click → course + instructor detail
      div.querySelectorAll('[data-cloud]').forEach(el => {
        el.addEventListener('click', () => {
          const cloud = el.dataset.cloud;
          const color = CLOUD_COLORS[cloud] || CLOUD_COLORS.Other;
          const courses = Object.entries(cloudCourses[cloud]).sort((a,b)=>b[1]-a[1]);
          const instructors = Object.entries(cloudInstructors[cloud]||{}).sort((a,b)=>b[1]-a[1]);
          const del = cloudDelivery[cloud]||{course:0,workshop:0};
          const maxC = courses[0][1];
          const instMap = {};
          D.instructors.forEach(inst => { instMap[inst.i] = inst; });

          // For Other: show full campaign names instead of course codes
          const isOther = cloud === 'Other';
          const courseEntries = isOther
            ? Object.entries(cloudCampNames||{}).sort((a,b)=>b[1]-a[1])
            : courses;
          const maxCE = courseEntries.length ? courseEntries[0][1] : 1;

          const courseRows = courseEntries.map(([label,h]) => {
            const w = maxCE>0 ? h/maxCE*100 : 0;
            const pct = cloudHrs[cloud]>0 ? h/cloudHrs[cloud]*100 : 0;
            const displayLabel = isOther
              ? `<div style="flex:1;min-width:0;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${label}">${label}</div>`
              : `<div style="width:72px;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0">${label}</div>`;
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              ${displayLabel}
              ${isOther ? '' : `<div style="flex:1;height:14px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="height:100%;width:${w.toFixed(1)}%;background:${color};opacity:0.8;border-radius:3px"></div></div>`}
              <div style="width:50px;text-align:right;font-size:11px;color:var(--text2);flex-shrink:0">${fmt(h)} h</div>
              <div style="width:34px;text-align:right;font-size:10px;color:var(--text3);flex-shrink:0">${fmtPct(pct)}</div>
            </div>`;
          }).join('');

          const instRows2 = instructors.slice(0,10).map(([iStr,h]) => {
            const inst = instMap[parseInt(iStr)];
            if (!inst) return '';
            const pct = cloudHrs[cloud]>0 ? h/cloudHrs[cloud]*100 : 0;
            const w = instructors[0][1]>0 ? h/instructors[0][1]*100 : 0;
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
              <div style="width:130px;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${inst.name}">${inst.name}</div>
              <div style="flex:1;height:12px;background:var(--bg);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${w.toFixed(1)}%;background:${color};opacity:0.6;border-radius:3px"></div>
              </div>
              <div style="width:46px;text-align:right;font-size:10px;color:var(--text2)">${fmt(h)} h</div>
              <div style="width:32px;text-align:right;font-size:10px;color:var(--text3)">${fmtPct(pct)}</div>
            </div>`;
          }).join('');

          const totalHrs = cloudHrs[cloud];
          document.getElementById('cloud-detail').innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>
              <span style="font-size:13px;font-weight:700;color:var(--text)">${cloud}</span>
              <span style="font-size:12px;color:var(--text3);margin-left:4px">${fmt(totalHrs)} hrs · ${isOther ? courseEntries.length + ' campaigns (unclassified — click to review)' : courses.length + ' courses · ' + instructors.length + ' instructors'}</span>
            </div>
            <div style="display:flex;gap:14px;margin-bottom:12px;padding:8px 10px;background:var(--bg);border-radius:6px">
              <div style="font-size:11px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;background:${color};opacity:0.92;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Course <strong>${fmt(del.course)} h</strong> (${fmtPct(totalHrs>0?del.course/totalHrs*100:0)})</div>
              <div style="font-size:11px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;background:${color};opacity:0.42;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Workshop <strong>${fmt(del.workshop)} h</strong> (${fmtPct(totalHrs>0?del.workshop/totalHrs*100:0)})</div>
            </div>
            <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Courses</div>
            ${courseRows}
            <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px">Top Instructors</div>
            ${instRows2}`;
        });
      });
    }
  }

  rebind();
}

let subcoRegionF = 'ALL';
let subcoCloudF = 'ALL';
let subcoCoF = 'ALL';
let subcoSelectedCloud = null;  // null = overview; string = drilldown into cloud
let subcoSortKey = 'duration';
let subcoSortAsc = false;
let subcoChart = null;

function subcoFilter(rows) {
  return rows.filter(r => {
    if (subcoRegionF !== 'ALL' && SUBCO_REGIONS[r[3]] !== subcoRegionF) return false;
    if (subcoCloudF !== 'ALL' && getCloud(r[2]) !== subcoCloudF) return false;
    if (subcoCoF !== 'ALL' && SUBCO_COMPANIES[r[0]] !== subcoCoF) return false;
    return true;
  });
}

function renderSubco() {
  const el = document.getElementById('tab-content');
  const filtered = subcoFilter(SUBCO);

  // Aggregate totals — primary metric is days
  let totalDays = 0, totalCnt = 0;
  const byCloud = {}, byCloudMonth = {};
  for (const r of filtered) {
    const days = r[5], cnt = r[6];
    const cloud = getCloud(r[2]);
    const month = SUBCO_MONTHS[r[1]];
    totalDays += days; totalCnt += cnt;
    byCloud[cloud] = (byCloud[cloud]||0) + days;
    if (!byCloudMonth[cloud]) byCloudMonth[cloud] = {};
    byCloudMonth[cloud][month] = (byCloudMonth[cloud][month]||0) + days;
  }

  const clouds = CLOUD_ORDER.filter(c => byCloud[c]);

  // Build filter bar
  const regionBtns = ['ALL','AMER','APAC','EMEA','JP','LATAM'].map(r =>
    `<button class="filter-pill ${subcoRegionF===r?'active':''}" data-reg="${r}">${r==='ALL'?'All Regions':r}</button>`).join('');
  const cloudBtns = ['ALL',...CLOUD_ORDER.filter(c=>byCloud[c]||subcoCloudF===c)].map(c =>
    `<button class="filter-pill ${subcoCloudF===c?'active':''}" data-cld="${c}" style="${subcoCloudF===c&&c!=='ALL'?'border-color:'+((CLOUD_COLORS[c])||'#999'):''}">
      ${c!=='ALL'?`<span class="dot" style="background:${CLOUD_COLORS[c]||'#aaa'};margin-right:4px"></span>`:''}${c==='ALL'?'All Clouds':c}</button>`).join('');
  // Top 15 companies by total days in filtered set
  const coTotals = {};
  for (const r of filtered) coTotals[r[0]] = (coTotals[r[0]]||0) + r[5];
  const topCos = Object.entries(coTotals).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([i])=>+i);
  const coBtns = [
    `<button class="filter-pill ${subcoCoF==='ALL'?'active':''}" data-co="ALL">All Companies</button>`,
    ...topCos.map(i => `<button class="filter-pill ${subcoCoF===SUBCO_COMPANIES[i]?'active':''}" data-co="${SUBCO_COMPANIES[i]}" title="${SUBCO_COMPANIES[i]}">${SUBCO_COMPANIES[i].length>22?SUBCO_COMPANIES[i].slice(0,20)+'…':SUBCO_COMPANIES[i]}</button>`)
  ].join('');

  el.innerHTML = `
    <div style="margin-bottom:10px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px">Region</div>
      <div class="filter-pills" id="subco-reg-pills">${regionBtns}</div>
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px">Cloud</div>
      <div class="filter-pills" id="subco-cld-pills">${cloudBtns}</div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px">Delivery Company <span style="font-weight:400;text-transform:none">(top 15 by days)</span></div>
      <div class="filter-pills" id="subco-co-pills">${coBtns}</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
      <div class="kpi"><div class="kpi-label">Course Days</div><div class="kpi-val">${Math.round(totalDays).toLocaleString()}</div><div class="kpi-sub">FY27 subco days booked</div></div>
      <div class="kpi"><div class="kpi-label">Bookings</div><div class="kpi-val">${Math.round(totalCnt).toLocaleString()}</div><div class="kpi-sub">delivery sessions</div></div>
      <div class="kpi"><div class="kpi-label">Companies</div><div class="kpi-val">${Object.keys(coTotals).length}</div><div class="kpi-sub">unique subcontractors</div></div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px">
      <div class="card">
        <h3>Days by Month &amp; Cloud — FY27</h3>
        <div class="chart-wrap" style="height:200px"><canvas id="subco-chart"></canvas></div>
        <div class="legend-row" id="subco-legend"></div>
      </div>
      <div class="card">
        <h3>Total Days by Cloud — click to drill down</h3>
        <div id="subco-cloud-bars"></div>
      </div>
    </div>

    <div id="subco-month-detail" style="margin-bottom:12px"></div>
    <div id="subco-detail"></div>
  `;

  // ── Monthly stacked bar chart ──────────────────────────────────────────────
  renderSubcoChart(filtered, clouds, byCloudMonth, totalDays);

  // ── Cloud breakdown bars (clickable) ──────────────────────────────────────
  const cloudBarsEl = document.getElementById('subco-cloud-bars');
  const maxD = Math.max(...clouds.map(c=>byCloud[c]||0));
  cloudBarsEl.innerHTML = clouds.map(c => {
    const days = byCloud[c]||0;
    const pct = totalDays > 0 ? days/totalDays*100 : 0;
    const isActive = subcoSelectedCloud === c;
    return `<div class="hbar-row" style="cursor:pointer;opacity:${subcoSelectedCloud&&!isActive?0.5:1}" data-cloud="${c}">
      <div class="hbar-label" style="width:120px;font-size:12px;color:${CLOUD_COLORS[c]||'#aaa'};font-weight:${isActive?700:500}">${c}</div>
      <div class="hbar-track" style="height:16px">
        <div class="hbar-fill" style="width:${maxD>0?days/maxD*100:0}%;background:${CLOUD_COLORS[c]||'#aaa'};opacity:${isActive?1:0.8}"></div>
      </div>
      <div class="hbar-hrs" style="font-weight:${isActive?700:400}">${Math.round(days)}d</div>
      <div style="width:36px;text-align:right;font-size:11px;color:var(--text3)">${pct.toFixed(0)}%</div>
    </div>`;
  }).join('');

  // ── Course drilldown for selected cloud ──────────────────────────────────
  renderSubcoDrilldown(filtered);

  // ── Events ──────────────────────────────────────────────────────────────
  el.querySelectorAll('[data-reg]').forEach(b => b.addEventListener('click', () => {
    subcoRegionF = b.dataset.reg; subcoSelectedCloud = null; renderSubco();
  }));
  el.querySelectorAll('[data-cld]').forEach(b => b.addEventListener('click', () => {
    subcoCloudF = b.dataset.cld; subcoSelectedCloud = null; renderSubco();
  }));
  el.querySelectorAll('[data-co]').forEach(b => b.addEventListener('click', () => {
    subcoCoF = b.dataset.co; subcoSelectedCloud = null; renderSubco();
  }));
  el.querySelectorAll('[data-cloud]').forEach(b => b.addEventListener('click', () => {
    subcoSelectedCloud = subcoSelectedCloud === b.dataset.cloud ? null : b.dataset.cloud;
    renderSubcoDrilldown(filtered);
    renderSubcoChart(filtered, clouds, byCloudMonth, totalDays);
    // Update bar highlighting
    el.querySelectorAll('[data-cloud]').forEach(bb => {
      const active = subcoSelectedCloud === bb.dataset.cloud;
      bb.style.opacity = subcoSelectedCloud && !active ? '0.5' : '1';
      bb.querySelector('.hbar-label').style.fontWeight = active ? '700':'500';
      bb.querySelector('.hbar-fill').style.opacity = active ? '1':'0.8';
    });
  }));
}

function renderSubcoChart(filtered, clouds, byCloudMonth, totalDays) {
  if (subcoChart) { subcoChart.destroy(); subcoChart = null; }
  const isDk = document.documentElement.getAttribute('data-theme')==='dark';
  const gridC = isDk ? '#2e3a4e':'#e2e6ed';
  const tickC = isDk ? '#c3c2b7':'#52514e';
  const legendEl = document.getElementById('subco-legend');
  const ctx = document.getElementById('subco-chart')?.getContext('2d');
  if (!ctx) return;

  let datasets, legendItems, title;

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function shadeColor(hex, frac) {
    const [r,g,b] = hexToRgb(hex);
    const mix = c => Math.round(c + (255-c)*frac);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }

  if (subcoSelectedCloud) {
    // Drilldown: courses within the selected cloud, stacked by month
    const cloud = subcoSelectedCloud;
    const cloudColor = CLOUD_COLORS[cloud] || '#aaa';
    const cloudRows = filtered.filter(r => getCloud(r[2]) === cloud);

    // Aggregate by course×month
    const byCourseMonth = {};
    for (const r of cloudRows) {
      const course = r[2], month = SUBCO_MONTHS[r[1]], days = r[5];
      if (!byCourseMonth[course]) byCourseMonth[course] = {};
      byCourseMonth[course][month] = (byCourseMonth[course][month]||0) + days;
    }
    // Sort courses by total days descending, keep top 12 + Other
    const courseTotals = Object.entries(byCourseMonth)
      .map(([c, m]) => [c, Object.values(m).reduce((s,v)=>s+v,0)])
      .sort((a,b) => b[1]-a[1]);
    const TOP_N = 12;
    const topCourses = courseTotals.slice(0, TOP_N).map(([c])=>c);
    const restCourses = courseTotals.slice(TOP_N).map(([c])=>c);

    // Generate shades of the cloud color for courses within this cloud
    const shades = topCourses.map((_,i) => shadeColor(cloudColor, i / Math.max(topCourses.length, 1) * 0.65));

    datasets = topCourses.map((course, i) => ({
      label: course,
      data: SUBCO_MONTHS.map(m => Math.round(byCourseMonth[course]?.[m]||0)||null),
      backgroundColor: shades[i],
      stack:'s', borderWidth:0, borderRadius:2
    }));
    if (restCourses.length) {
      const otherData = SUBCO_MONTHS.map(m => {
        const v = restCourses.reduce((s,c) => s+(byCourseMonth[c]?.[m]||0), 0);
        return Math.round(v)||null;
      });
      datasets.push({ label:'Other courses', data:otherData, backgroundColor:'#aaa', stack:'s', borderWidth:0, borderRadius:2 });
    }
    legendItems = [...topCourses.map((c,i)=>({label:c, color:shades[i]})),
      ...(restCourses.length?[{label:'Other courses',color:'#aaa'}]:[])];
    title = `${cloud} — Days by Course & Month`;
  } else {
    // Overview: all courses stacked, each colored by its cloud
    const byCourseMonth = {};
    for (const r of filtered) {
      const course = r[2], month = SUBCO_MONTHS[r[1]], days = r[5];
      if (!byCourseMonth[course]) byCourseMonth[course] = {};
      byCourseMonth[course][month] = (byCourseMonth[course][month]||0) + days;
    }
    const courseTotals = Object.entries(byCourseMonth)
      .map(([c, m]) => [c, Object.values(m).reduce((s,v)=>s+v,0)])
      .sort((a,b) => b[1]-a[1]);
    const TOP_N = 15;
    const topCourses = courseTotals.slice(0, TOP_N).map(([c])=>c);
    const restCourses = courseTotals.slice(TOP_N).map(([c])=>c);

    // Each course gets its cloud color, with slight shade variation per course within same cloud
    const cloudCourseIdx = {};
    datasets = topCourses.map(course => {
      const cl = getCloud(course);
      const base = CLOUD_COLORS[cl] || '#aaa';
      cloudCourseIdx[cl] = (cloudCourseIdx[cl] || 0);
      const shade = shadeColor(base, cloudCourseIdx[cl] * 0.18);
      cloudCourseIdx[cl]++;
      return {
        label: course,
        data: SUBCO_MONTHS.map(m => Math.round(byCourseMonth[course]?.[m]||0)||null),
        backgroundColor: shade,
        stack:'s', borderWidth:0, borderRadius:2
      };
    });
    if (restCourses.length) {
      const otherData = SUBCO_MONTHS.map(m => {
        const v = restCourses.reduce((s,c) => s+(byCourseMonth[c]?.[m]||0), 0);
        return Math.round(v)||null;
      });
      datasets.push({ label:'Other courses', data:otherData, backgroundColor:'#bbb', stack:'s', borderWidth:0, borderRadius:2 });
    }
    // Legend: show clouds (not every course)
    legendItems = clouds.map(c => ({label:c, color:CLOUD_COLORS[c]||'#aaa'}));
    if (restCourses.length) legendItems.push({label:'Other courses', color:'#bbb'});
    title = 'Days by Course & Month — FY27';
  }

  // Update card title
  const h3 = document.querySelector('#tab-content .card h3');
  if (h3) h3.textContent = title;

  subcoChart = new Chart(ctx, {
    type:'bar',
    data: {labels: SUBCO_MONTHS, datasets},
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{mode:'index',intersect:false,
        callbacks:{ label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}d` }
      }},
      scales:{
        x:{stacked:true,grid:{color:gridC},ticks:{color:tickC,font:{size:10}}},
        y:{stacked:true,grid:{color:gridC},ticks:{color:tickC,font:{size:10}},beginAtZero:true}
      },
      onClick(event, elements) {
        if (!elements.length) return;
        const monthIdx = elements[0].index;  // 0=Feb 2026 … 11=Jan 2027
        renderSubcoMonthDetail(filtered, monthIdx);
      }
    }
  });
  if (legendEl) legendEl.innerHTML = legendItems.map(({label,color})=>
    `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${label}</div>`
  ).join('');
}

function renderSubcoMonthDetail(filtered, monthIdx) {
  const el = document.getElementById('subco-month-detail');
  if (!el) return;

  // Toggle off if same month clicked again
  if (el.dataset.month === String(monthIdx)) {
    el.innerHTML = '';
    el.dataset.month = '';
    return;
  }
  el.dataset.month = String(monthIdx);

  const month = SUBCO_MONTHS[monthIdx];
  const rows = filtered.filter(r => r[1] === monthIdx);
  const cloudLabel = subcoSelectedCloud ? ` · ${subcoSelectedCloud}` : '';

  // Group by company → courses
  const byCompany = {};
  for (const r of rows) {
    const co = SUBCO_COMPANIES[r[0]];
    const course = r[2];
    const days = r[5];
    if (!byCompany[co]) byCompany[co] = {days: 0, courses: {}};
    byCompany[co].days += days;
    byCompany[co].courses[course] = (byCompany[co].courses[course] || 0) + days;
  }

  const sorted = Object.entries(byCompany).sort((a, b) => b[1].days - a[1].days);
  const totalDays = sorted.reduce((s, [, v]) => s + v.days, 0);

  el.innerHTML = `
    <div class="card" style="border-left:3px solid var(--c-P)">
      <h3>${month}${cloudLabel} — Subcontractors booked
        <button id="subco-month-close" style="font-size:11px;font-weight:400;background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;color:var(--text2);margin-left:8px">✕ Close</button>
      </h3>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">${sorted.length} companies · ${Math.round(totalDays)} days</div>
      <table>
        <thead><tr>
          <th>Company</th>
          <th class="num">Days</th>
          <th>Courses delivered</th>
        </tr></thead>
        <tbody>
          ${sorted.map(([co, v]) => {
            const courseList = Object.entries(v.courses)
              .sort((a, b) => b[1] - a[1])
              .map(([c, d]) => `${c} (${Math.round(d)}d)`)
              .join(', ');
            return `<tr>
              <td class="total-bold">${co}</td>
              <td class="num">${Math.round(v.days)}</td>
              <td style="font-size:11px;color:var(--text2)">${courseList}</td>
            </tr>`;
          }).join('')}
          <tr style="font-weight:700;border-top:2px solid var(--border)">
            <td>TOTAL</td>
            <td class="num">${Math.round(totalDays)}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>`;

  document.getElementById('subco-month-close').addEventListener('click', () => {
    el.innerHTML = '';
    el.dataset.month = '';
  });
}

function renderSubcoDrilldown(filtered) {
  const el = document.getElementById('subco-detail');
  if (!el) return;
  if (!subcoSelectedCloud) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px 0">Click a cloud bar above to see courses within that cloud.</div>';
    return;
  }
  const cloud = subcoSelectedCloud;
  const cloudRows = filtered.filter(r => getCloud(r[2]) === cloud);
  
  // Aggregate by course
  const byCourse = {};
  for (const r of cloudRows) {
    const c = r[2];
    if (!byCourse[c]) byCourse[c] = {course:c, days:0, cnt:0, regions:new Set(), companies:new Set()};
    byCourse[c].days += r[5];
    byCourse[c].cnt += r[6];
    byCourse[c].regions.add(SUBCO_REGIONS[r[3]]);
    byCourse[c].companies.add(SUBCO_COMPANIES[r[0]]);
  }
  const rows = Object.values(byCourse).sort((a,b) => b.days - a.days);
  const totalDaysD = rows.reduce((s,r)=>s+r.days,0);
  const totalCnt = rows.reduce((s,r)=>s+r.cnt,0);

  el.innerHTML = `
    <div class="card">
      <h3 style="color:${CLOUD_COLORS[cloud]||'#aaa'}">${cloud} — Course Detail &nbsp;<button id="subco-back" style="font-size:11px;font-weight:400;background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;color:var(--text2)">✕ Close</button></h3>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">${rows.length} courses · ${Math.round(totalDaysD)} days · ${Math.round(totalCnt)} bookings</div>
      <table>
        <thead><tr>
          <th>Course</th>
          <th class="num">Days</th>
          <th class="num">Bookings</th>
          <th>Regions</th>
          <th>Companies</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="total-bold">${r.course}</td>
            <td class="num">${Math.round(r.days)}</td>
            <td class="num">${Math.round(r.cnt)}</td>
            <td style="font-size:11px;color:var(--text3)">${[...r.regions].sort().join(', ')}</td>
            <td style="font-size:11px;color:var(--text3)">${[...r.companies].sort().join(', ')}</td>
          </tr>`).join('')}
          <tr style="font-weight:700;border-top:2px solid var(--border)">
            <td>TOTAL</td>
            <td class="num">${Math.round(totalDaysD)}</td>
            <td class="num">${Math.round(totalCnt)}</td>
            <td></td><td></td>
          </tr>
        </tbody>
      </table>
    </div>`;
  document.getElementById('subco-back').addEventListener('click', () => {
    subcoSelectedCloud = null;
    renderSubcoDrilldown(filtered);
    // Need byCloudMonth in scope — trigger full chart re-render via renderSubco
    renderSubco();
  });
}

      </div>
      <div class="card" style="padding:16px">

  // Monthly bar chart
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    type: 'bar',
